<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ice:#EEF3F6;--surface:#FFFFFF;--boards:#12263A;--ink:#12263A;--muted:#5B6B7A;
  --line:#D5DEE5;--red:#D7262E;--blue:#2453A6;--crease:#CFE2F2;--good:#1D7A4A;--chip:#E3EAF0;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --ice:#0E1A26;--surface:#15263A;--boards:#08121C;--ink:#E6EEF4;--muted:#93A6B6;
  --line:#26394D;--red:#F0474E;--blue:#6E9BEA;--crease:#1C3550;--good:#4CC28A;--chip:#1E3247;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ice);color:var(--ink);font:16px/1.5 Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--boards)}
h1,h2,h3{font-family:"Saira Condensed","Arial Narrow",Arial,sans-serif}
button{font:inherit;color:inherit}
a{color:var(--blue)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}

header{background:var(--boards);color:#fff;padding:18px 18px 0}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header h1{margin:0;font-size:2.3rem;line-height:1;font-weight:800}
header .sub{color:#A9BCCD;margin:6px 0 14px;font-size:.95rem}
header .acct{flex:none;white-space:nowrap;text-align:right;font-size:.88rem;color:#A9BCCD}
header .acct button{background:none;border:1px solid #3A5168;color:#fff;border-radius:6px;padding:3px 10px;margin-top:4px;cursor:pointer}
header .back{color:#A9BCCD;text-decoration:none;font-size:.9rem;display:inline-block;margin-bottom:6px}
.redline{height:6px;background:var(--red);margin:0 -18px}
nav{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:1 0 auto;text-align:center;padding:10px 3px 12px;font-size:.76rem;white-space:nowrap;color:#A9BCCD;text-decoration:none;font-weight:600;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:#fff;border-color:#fff}

main{padding:18px 18px 48px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px;color:var(--muted)}
.note strong{color:var(--ink)}
.warn{border-color:var(--red)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.panel h3{margin:0 0 10px;font-size:1.35rem}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-weight:600;font-size:.92rem;margin-bottom:4px}
.field input,.field select,.row input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ice);color:var(--ink);font:inherit}
.check{display:flex;gap:10px;align-items:center;margin:0 0 14px;font-weight:600;font-size:.92rem}
.check input{width:20px;height:20px;flex:none;margin-top:2px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%}
.links{display:flex;justify-content:space-between;margin-top:14px;font-size:.92rem}
.links button{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;text-decoration:underline}
.err{color:var(--red);font-size:.92rem;margin:0 0 10px}
.ok{color:var(--good);font-size:.92rem;margin:0 0 10px}

.poolcard{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--ink)}
.poolcard strong{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:1.4rem;font-weight:700;display:block;line-height:1.1}
.poolcard small{color:var(--muted)}
.badge{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}

.me{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.me .who{font-weight:600}
.me .used{color:var(--muted);font-size:.9rem}
.pucks{display:flex;gap:7px;align-items:flex-end}
/* 3D hockey puck: a dark rubber cylinder seen from slightly above */
.puck{--w:28px;--h:20px;--t:9px;position:relative;width:var(--w);height:var(--h);flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.puck::after{content:"";position:absolute;left:0;right:0;top:calc(var(--t)/2);bottom:0;
  border-radius:0 0 50% 50%/0 0 calc(var(--t)/2) calc(var(--t)/2);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),
             linear-gradient(90deg,#050505,#2b2b2b 38%,#3a3a3a 50%,#1a1a1a 70%,#050505)}
.puck::before{content:"";position:absolute;left:0;right:0;top:0;height:var(--t);border-radius:50%;z-index:1;
  background:radial-gradient(ellipse at 38% 35%,#5a5a5a 0,#2a2a2a 45%,#141414 80%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.puck.lost{opacity:.18;filter:grayscale(1)}
.football{display:inline-block;flex:none;line-height:0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));transform:rotate(-12deg)}
.football.lost{opacity:.2;filter:grayscale(1)}
td .puck,.prow .puck{--w:18px;--h:13px;--t:6px}
@media (prefers-color-scheme:dark){.puck::before{box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}.puck{filter:drop-shadow(0 0 1px rgba(255,255,255,.35))}.puck.lost{opacity:.25}}

.weekbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.weekbar h2{margin:0;font-size:1.6rem;font-weight:700}
.weekbar button{background:none;border:1px solid var(--line);border-radius:8px;width:40px;height:40px;cursor:pointer}
.weekbar button:disabled{opacity:.35;cursor:default}
.meta{color:var(--muted);font-size:.88rem;margin:-6px 0 14px}

.game{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.game .top{display:flex;justify-content:space-between;padding:10px 14px 0;color:var(--muted);font-size:.85rem}
.sides{display:grid;grid-template-columns:1fr 1fr}
.side{background:none;border:0;padding:10px 14px 12px;text-align:left;cursor:pointer}
.side.home{text-align:right}
.side:disabled{cursor:default}
.side .abbr{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:2rem;font-weight:800;line-height:1;display:block}
.side .name{font-size:.85rem;color:var(--muted);display:block}
.side .pct{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:1.25rem;font-weight:700}
.side .tag{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:6px;background:var(--chip);color:var(--muted)}
.side.picked{background:var(--crease);box-shadow:inset 0 0 0 3px var(--blue)}
.side.picked .tag{background:var(--blue);color:#fff}
.game.has-pick .side:not(.picked){opacity:.5}
.game.has-pick{border-color:var(--blue)}
.mypick{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--blue);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.mypick .lbl{font-size:.8rem;font-weight:600;color:var(--blue);text-transform:none}
.mypick strong{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:1.45rem;line-height:1.1;display:block}
.mypick small{color:var(--muted)}
.mypick.none{border-style:dashed;border-color:var(--line)}
.mypick.none .lbl{color:var(--muted)}
.matchup{border-top:1px solid var(--line)}
.matchup summary{cursor:pointer;list-style:none;padding:10px 14px;font-size:.88rem;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.matchup summary::-webkit-details-marker{display:none}
.matchup summary b{color:var(--ink);font-weight:600}
.matchup summary::after{content:"Show ▾";color:var(--blue);font-weight:600;white-space:nowrap}
.matchup[open] summary::after{content:"Hide ▴"}
.mtable{width:100%;border:0;border-radius:0;background:none;font-size:.88rem}
.mtable th,.mtable td{padding:6px 14px;border-bottom:1px solid var(--line);text-align:center}
.mtable td:first-child,.mtable th:first-child{text-align:left;color:var(--muted);font-weight:500}
.mtable .better{font-weight:700;color:var(--good)}
.edge{padding:10px 14px 12px;font-size:.9rem}
.potw{display:flex;align-items:center;gap:12px}
.potw strong{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:1.4rem;line-height:1.1;display:block}
.potw small{color:var(--muted);display:block}
.potw+.potw{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

.pkrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.pkrow:first-of-type{border-top:0;padding-top:0}
.pkrow .who{flex:1;min-width:0}
.pkrow .who strong{display:block}
.pkrow .who small{color:var(--muted)}
.pkrow .pk{display:flex;align-items:center;gap:8px;justify-content:flex-end;text-align:right}
.pkrow .pk small{display:block;color:var(--muted)}
.pkrow .pk strong{display:block}
.res{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.res.w{background:var(--good);color:#fff}.res.l{background:var(--red);color:#fff}
.popular{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.popular span{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:99px;padding:3px 10px 3px 4px;font-weight:600;font-size:.88rem}
.popular .logo{width:22px;height:22px}
.popular .medal{background:none;padding:0;font-size:1rem}
.friendly{display:inline-flex;align-items:center;gap:6px;background:#F5C542;color:#12263A;font-weight:700;font-size:.82rem;padding:3px 10px;border-radius:99px;margin:-6px 0 14px}
.badge.friendly-b{background:#F5C542;color:#12263A}
.winner{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#F5C542,#E9A920);color:#12263A;border-radius:12px;padding:14px 16px;margin-bottom:16px}
.winner .cup{font-size:2.2rem;line-height:1}
.winner strong{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:1.5rem;line-height:1.1;display:block}
.winner small{display:block;font-weight:600;opacity:.85}
.rulesdrop{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.rulesdrop summary{cursor:pointer;list-style:none;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.rulesdrop summary::-webkit-details-marker{display:none}
.rulesdrop summary::after{content:"Show ▾";color:var(--blue);font-size:.88rem}
.rulesdrop[open] summary::after{content:"Hide ▴"}
.rulesdrop[open] summary{border-bottom:1px solid var(--line)}
.rulesbody{padding:14px 16px 4px}
.rulesbody .panel{border:0;padding:0;margin-bottom:16px;background:none}
.bye{display:flex;align-items:center;gap:14px;background:var(--crease);border:2px solid var(--blue);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.bye .ico{font-size:2rem;line-height:1}
.bye strong{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:1.45rem;line-height:1.1;display:block}
.bye small{color:var(--muted);display:block}
.byelist{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.byelist .chip{display:inline-flex;align-items:center;gap:8px;background:var(--chip);border-radius:99px;padding:5px 6px 5px 12px;font-weight:600;font-size:.9rem}
.byelist .chip button{border:0;background:var(--surface);border-radius:99px;width:24px;height:24px;cursor:pointer;font-weight:700;line-height:1}
nav a.dot{position:relative}
nav a.dot::after{content:"";position:absolute;top:8px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;height:calc(100vh - 360px);min-height:340px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;align-self:flex-start}
.msg.mine{align-self:flex-end;text-align:right}
.msg .who{font-size:.78rem;font-weight:600;color:var(--muted);margin:0 4px 2px}
.msg .bubble{display:inline-block;text-align:left;padding:8px 12px;border-radius:14px;background:var(--chip);white-space:pre-wrap;word-break:break-word;line-height:1.4}
.msg.mine .bubble{background:var(--blue);color:#fff}
.msg .when{font-size:.72rem;color:var(--muted);margin:2px 4px 0}
.msg .when button{border:0;background:none;color:var(--muted);font-size:.72rem;cursor:pointer;padding:0 0 0 6px;text-decoration:underline}
.daysep{align-self:center;font-size:.75rem;font-weight:600;color:var(--muted);background:var(--ice);border-radius:99px;padding:2px 10px}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;resize:none;height:42px;max-height:120px;padding:10px 12px;border:1px solid var(--line);border-radius:20px;background:var(--ice);color:var(--ink);font:inherit}
.composer .btn{border-radius:20px}
.journey{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px;margin:-4px 0 16px;scrollbar-width:none}
.journey::-webkit-scrollbar{display:none}
.ring{flex:none;width:50px;text-align:center;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit}
.ring .c{width:46px;height:46px;margin:0 auto;border-radius:50%;border:3px solid var(--line);background:var(--surface);display:grid;place-items:center;overflow:hidden;font-weight:700;font-size:.72rem;color:var(--muted)}
.ring .c .logo{width:30px;height:30px}
.ring.w .c{border-color:var(--good)}
.ring.l .c{border-color:var(--red)}
.ring.l .c .logo{opacity:.55;filter:grayscale(.6)}
.ring.p .c{border-color:var(--blue)}
.ring.open .c{border-style:dashed;border-color:var(--blue);color:var(--blue);font-size:1.1rem}
.ring.miss .c{border-style:dashed;border-color:var(--red);color:var(--red);font-size:1rem}
.ring.rbye .c{border-style:dotted}
.ring.future .c{border-style:dashed;border-color:var(--line);background:transparent}
.ring.future small{opacity:.7}
.ring.cur .c{box-shadow:0 0 0 3px var(--crease)}
.ring small{display:block;margin-top:3px;font-size:.68rem;font-weight:600;color:var(--muted);white-space:nowrap}
header .ruleslink{display:inline-block;margin:-8px 0 12px;color:#fff;font-size:.88rem;font-weight:600;text-decoration:none;border:1px solid #3A5168;border-radius:99px;padding:3px 12px}
.rulestext{white-space:pre-wrap;margin:0;line-height:1.55}
.ruleslist{margin:0;padding-left:20px}
.ruleslist li{margin:6px 0}
textarea.rules{width:100%;min-height:180px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ice);color:var(--ink);font:inherit;resize:vertical}
.xlink{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600;margin-top:8px;background:var(--ice)}
.xlink small{display:block;color:var(--muted);font-weight:400}
.side.used .abbr,.side.used .pct,.side.used .logo{opacity:.35}
.side{display:flex;align-items:center;gap:12px}
.side.home{flex-direction:row-reverse}
.side .info{min-width:0;flex:1}
.logo{width:48px;height:48px;flex:none;display:block}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
img.logo{object-fit:contain}
.logo.logo-sm{width:32px;height:32px}
.pickrow{display:flex;align-items:center;gap:10px}
.side.won .tag{background:var(--good);color:#fff}
.side.lost .tag{background:var(--red);color:#fff}
.bar{display:flex;height:10px;position:relative}
.bar span{display:block;height:100%}
.bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--red);transform:translateX(-1px)}
.score{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.1rem;color:var(--ink)}

table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.85rem}
tr:last-child td{border-bottom:0}
tr.out td{opacity:.5}
.tablewrap{overflow-x:auto}
.hist{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.hist{gap:6px}
.hist>span{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:700;padding:2px 7px 2px 3px;border-radius:7px;background:var(--chip);border:2px solid transparent}
.hist>span .logo{width:25px;height:25px;flex:none;overflow:hidden}
.hist>span .logo img,.hist>span img.logo{transform:scale(1.25)}
.hist .w{background:#E9F7EF;border-color:var(--good);color:#145A32}
.hist .l{background:#FDECEC;border-color:var(--red);color:#8E1B1B}

.prow{border-top:1px solid var(--line);padding:12px 0}
.prow:first-of-type{border-top:0;padding-top:0}
.prow .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prow .detail{color:var(--muted);font-size:.85rem;margin:2px 0 8px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.sm{border:1px solid var(--line);background:var(--ice);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:.88rem;font-weight:600}
.sm.danger{color:var(--red)}
.sm:disabled{opacity:.4;cursor:default}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--boards);color:#fff;padding:10px 16px;border-radius:8px;font-size:.92rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.notifybar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.notifybar .sm{flex:none}
.remrow{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer}
.remrow input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--blue)}
.remrow span{display:flex;flex-direction:column}
.renamebtn{background:none;border:0;padding:0;margin:2px 0;color:var(--blue);font:inherit;font-size:.85rem;cursor:pointer;text-decoration:underline}
.av{display:inline-flex;flex:none;border-radius:50%;overflow:hidden;align-items:center;justify-content:center;vertical-align:middle}
.av svg{display:block}
.av svg,.avpick svg{border-radius:50%}
.av-i{background:var(--blue);color:#fff;font-weight:700}

const resClass=r=>r==="pp"||r==="tw"?"w":r==="tl"?"l":r==="p"||r==="t"||r==="pre"?"":r;
// Early estimate until sportsbooks post odds: each team's record (log5) plus home advantage.
function estimate(g){
  const A=S.stats&&S.stats[g.away],H=S.stats&&S.stats[g.home];if(!A||!H||A.pct==null||H.pct==null)return null;
  const clamp=x=>Math.min(.9,Math.max(.1,x));
  // Records are noisy, so pull them toward .500 before comparing.
  const k=S.pool&&S.pool.sport==="nfl"?.6:.7,reg=x=>.5+(x-.5)*k;
  const pa=clamp(reg(+A.pct)),ph=clamp(reg(+H.pct));
  let h=(ph*(1-pa))/(ph*(1-pa)+pa*(1-ph));
  h=clamp(h+(S.pool&&S.pool.sport==="nfl"?.05:.035));
  return{away:Math.round((1-h)*1000)/10,home:Math.round(h*1000)/10};
}
// Win % for a game: sportsbook odds when posted, otherwise the estimate.
const winPcts=g=>g.away_pct!=null&&g.home_pct!=null?{away:+g.away_pct,home:+g.home_pct,est:false}:(()=>{const e=estimate(g);return e?{...e,est:true}:null})();
const pickPct=pk=>{const g=pickGame(pk);if(!g)return null;const v=g.away===pk.team?g.away_pct:g.home_pct;return v==null?null:+v};
const pickPctOrEst=pk=>{const g=pickGame(pk);if(!g)return null;const w=winPcts(g);return w?{v:g.away===pk.team?w.away:w.home,est:w.est}:null};

async function loadPool(id,quiet){
  const{data:pool,error}=await sb.from("pools").select("*").eq("id",id).maybeSingle();
  if(error||!pool){S.pool=null;S.loadedPool=null;if(!quiet)toast("You don’t have access to that pool.");return}
  const isC=pool.commissioner_id===uid()||(pool.co_commissioners||[]).includes(uid());
  const [games,mine,st,all,pend,ts]=await Promise.all([
    sb.from("games").select("*").eq("sport",pool.sport||"nhl").gte("game_date",pool.start_date).order("game_date").order("start_time"),
    sb.from("picks").select("game_date,team,game_id,set_by").eq("pool_id",id).eq("user_id",uid()),
    sb.rpc("pool_standings",{p:id}),
    sb.rpc("pool_picks",{p:id}),
    isC?sb.from("invites").select("id,email,created_at").eq("pool_id",id).is("accepted_at",null).order("created_at"):Promise.resolve({data:[]}),
    sb.from("team_stats").select("*").eq("sport",pool.sport||"nhl")
  ]);
  const sameWeek=S.loadedPool===id;
  S.pool=pool;S.games=games.data||[];S.myPicks=mine.data||[];S.standings=st.data||[];S.allPicks=all.data||[];S.pending=pend.data||[];
  S.stats={};for(const t of ts.data||[])S.stats[t.team]=t;
  const weeks=weekList();
  if(!sameWeek){S.picksIdx=null;S.gamesIdx=null}   // each pool opens on its own current week
  if(!sameWeek||S.weekIdx<0||S.weekIdx>=weeks.length){const i=weeks.findIndex(d=>!weekDone(d)&&!(pool.bye_weeks||[]).includes(d));S.weekIdx=i===-1?weeks.length-1:i}
  S.loadedPool=id;
  S.spectator=!isC&&!S.standings.some(r=>r.user_id===uid());
  if(!S.spectator)startChat(id);
}
const slateTitle=d=>{if(S.pool&&S.pool.sport==="nfl"){const g=S.games.find(x=>x.game_date===d);return `${(g&&g.week_label)||"Week"} · ${shortDate(d)}`}return fmtDate(d)};
const endedDay=()=>S.pool&&S.pool.ended_at?new Date(S.pool.ended_at).toLocaleDateString("en-CA",{timeZone:"America/New_York"}):null;
const weekList=()=>[...new Set(S.games.map(g=>g.game_date))].filter(d=>!S.pool||((!S.pool.end_date||d<=S.pool.end_date)&&(!endedDay()||d<=endedDay()))).sort();
const isOwner=()=>S.pool&&S.pool.commissioner_id===uid();

function renderPool(tab){
  if(S.spectator){
    if(!["standings","picks","games","rules"].includes(tab)){tab="standings";try{history.replaceState(null,"",`#pool/${S.pool.id}/standings`)}catch{}}
    renderHeader([["standings","Standings"],["games","Games"],["picks","All Picks"]]);

    return;
  }

  const tabs=[["saturday","My Team"],["standings","Standings"],["picks","All Picks"],["chat","Chat"]];
  if(isCommish())tabs.push(["commish","Commish Tools"]);

  const app=$("app");app.replaceChildren();
  const me=S.standings.find(r=>r.user_id===uid());

function renderSaturday(v){
  const me=S.standings.find(r=>r.user_id===uid());
  const limit=S.pool.max_picks_per_team;
  const counts={};for(const p of S.myPicks)counts[p.team]=(counts[p.team]||0)+1;
  if(me){
    v.append(el("div",{class:"me"},
      avatarEl(me.avatar,me.team_name,44),el("div",{style:"flex:1;min-width:0"},whoBlock(me),
        el("div",{class:"used",text:me.lives_left<=0?"Eliminated":`${me.lives_left} ${me.lives_left===1?"life":"lives"} left · ${me.strikes} strike${me.strikes===1?"":"s"} · ${me.wins} win${me.wins===1?"":"s"}`})),
      puckRow(me.lives_left,S.pool.lives)));
    if(me.team_name&&me.display_name===me.team_name)v.append(firstNamePanel());
  }
  const weeks=weekList();
  if(!weeks.length){
    if(S.pool.ended_at){v.append(el("div",{class:"note",text:"This pool has ended. Picks are closed and the results are final."}));return}
    v.append(el("div",{class:"note"},el("strong",{text:S.pool.sport==="nfl"?"No NFL games yet. ":"No Saturday games yet. "}),S.pool.sport==="nfl"?"Games load automatically once the NFL schedule syncs. Odds appear during the week.":"Games load automatically once the NHL schedule syncs. Odds appear a few days before puck drop."));
    renderMyPicks(v,counts,limit);v.append(remindersPanel());return;

  const order=revealed?[...gs].sort((a,b)=>{

    const sides=el("div",{class:"sides"});

    for(const [team,pct,cls] of [[g.away,wp&&wp.away,"away"],[g.home,wp&&wp.home,"home"]]){

          tag?el("div",{},el("span",{class:"tag",text:tag})):null));

/* ---------- Matchup notes, pick of the week, expert links ---------- */
const recPct=r=>{if(!r)return null;const n=String(r).split("-").map(Number);const tot=n.reduce((a,b)=>a+(b||0),0);return tot?n[0]/tot:null};
const formPct=t=>{if(!t||!t.form)return null;if(t.form.includes("-"))return recPct(t.form);const w=[...t.form].filter(c=>c==="W").length;return t.form.length?w/t.form.length:null};
const recText=t=>S.pool.sport==="nfl"?`${t.wins}–${t.losses}${t.otl?`–${t.otl}`:""}`:`${t.wins}–${t.losses}–${t.otl}`;
const dash=x=>x?String(x).replace(/-/g,"–"):"—";
function matchupEdge(g){
  const A=S.stats[g.away],H=S.stats[g.home];if(!A||!H)return null;
  const nfl=S.pool.sport==="nfl",marginGap=nfl?2:0.3;
  const f=[
    [A.pct,H.pct,.05,()=>`better record (${recText(A)})`,()=>`better record (${recText(H)})`],
    [recPct(A.road),recPct(H.home),.1,()=>`good on the road (${dash(A.road)})`,()=>`strong at home (${dash(H.home)})`],
    [formPct(A),formPct(H),.15,()=>"hotter lately",()=>"hotter lately"],
    [(A.pf??0)-(A.pa??0),(H.pf??0)-(H.pa??0),marginGap,()=>"bigger scoring margin",()=>"bigger scoring margin"],
  ];
  const ra=[],rh=[];
  for(const [a,h,gap,ta,th] of f){if(a==null||h==null)continue;if(a-h>gap)ra.push(ta());else if(h-a>gap)rh.push(th())}
  if(ra.length===rh.length)return{team:null,text:"Even matchup on paper."};
  const [team,why]=ra.length>rh.length?[g.away,ra]:[g.home,rh];
  return{team,text:`${why.join(", ")}.`};
}
function matchupNotes(g){
  const A=S.stats[g.away],H=S.stats[g.home];if(!A||!H)return null;
  const nfl=S.pool.sport==="nfl",e=matchupEdge(g);
  const num=x=>x==null?"—":(+x).toFixed(nfl?1:2);
  const row=(label,a,h,cmpA,cmpH)=>{const tr=el("tr",{},el("td",{text:label}));
    const ca=el("td",{text:a}),ch=el("td",{text:h});
    if(cmpA!=null&&cmpH!=null&&cmpA!==cmpH)(cmpA>cmpH?ca:ch).classList.add("better");
    tr.append(ca,ch);return tr};
  const body=el("tbody",{},
    row("Record",recText(A),recText(H),A.pct,H.pct),
    row("Road / home",`${dash(A.road)} road`,`${dash(H.home)} home`,recPct(A.road),recPct(H.home)),
    nfl?row("Last 5 (newest first)",A.form?[...A.form].join(" "):"—",H.form?[...H.form].join(" "):"—",formPct(A),formPct(H))
       :row("Last 10",dash(A.form),dash(H.form),formPct(A),formPct(H)),
    row("Streak",A.streak||"—",H.streak||"—"),
    row(nfl?"Points scored / game":"Goals for / game",num(A.pf),num(H.pf),+A.pf,+H.pf),
    row(nfl?"Points allowed / game":"Goals against / game",num(A.pa),num(H.pa),-A.pa,-H.pa));
  return el("details",{class:"matchup"},
    el("summary",{},el("span",{},"Matchup notes",e&&e.team?el("b",{text:` · Edge: ${e.team}`}):null)),
    el("table",{class:"mtable"},el("thead",{},el("tr",{},el("th",{text:""}),el("th",{text:g.away}),el("th",{text:g.home}))),body),
    e?el("div",{class:"edge"},e.team?el("b",{text:`Edge: ${teamName(e.team)} — `}):null,e.team?e.text:e.text):null);
}
// Safest pick: highest win % (odds) among games not yet locked; falls back to records.
function pickOfWeek(d,counts,limit,myPick){
  const open=gamesOn(d).filter(g=>!locked(d,g));if(!open.length)return null;
  const hasOdds=open.some(g=>g.away_pct!=null);
  const cands=[];
  for(const g of open)for(const [team,opp,pct,home] of [[g.away,g.home,g.away_pct,false],[g.home,g.away,g.home_pct,true]]){
    let score;
    if(hasOdds){if(pct==null)continue;score=+pct}
    else{const e=estimate(g);if(!e)continue;score=home?e.home:e.away}
    cands.push({team,opp,pct:hasOdds?+pct:score,score,home,est:!hasOdds});
  }
  if(!cands.length)return null;
  cands.sort((a,b)=>b.score-a.score);
  const avail=c=>(counts[c.team]||0)-(myPick===c.team?1:0)<limit;
  return{best:cands[0],mine:cands.find(avail),hasOdds};
}

  if(p.mine&&!bestAvail)panel.append(line(p.mine,"Best still available to you"));
  panel.append(el("p",{class:"meta",style:"margin:10px 0 0",text:p.hasOdds?"Based on sportsbook win odds for games that haven’t locked yet.":"Sportsbook odds aren’t posted yet, so these are early estimates from team records and home advantage. They switch to real odds once posted."}));

  const m=/&\s*(\d+|Goal)/i.exec(sit.down||"");const togo=m?(/goal/i.test(m[1])?null:+m[1]):null;

  let grass="";for(let k=0;k<20;k++)grass+=`<rect x="${X(k*5)}" y="0" width="${5*Y}" height="${H}" fill="${k%2?"#3F8A3C":"#4A9845"}"/>`;
  let lines="",hashes="",nums="";

  for(let v=1;v<100;v++)if(v%5)hashes+=`<line x1="${X(v)}" y1="18" x2="${X(v)}" y2="28" stroke="#fff" stroke-opacity=".7" stroke-width="1.6"/><line x1="${X(v)}" y1="${H-28}" x2="${X(v)}" y2="${H-18}" stroke="#fff" stroke-opacity=".7" stroke-width="1.6"/><line x1="${X(v)}" y1="${H*.38}" x2="${X(v)}" y2="${H*.38+8}" stroke="#fff" stroke-opacity=".55" stroke-width="1.4"/><line x1="${X(v)}" y1="${H*.62-8}" x2="${X(v)}" y2="${H*.62}" stroke="#fff" stroke-opacity=".55" stroke-width="1.4"/>`;
  for(let v=10;v<100;v+=10){const t=v<=50?v:100-v;
    const tri=(cx,cy,flip)=>v===50?"":`<path d="M${cx+(v<50?-1:1)*(flip?-1:1)*30} ${cy-6}l${(v<50?-1:1)*(flip?-1:1)*-0} 0l${(v<50?-1:1)*(flip?-1:1)*-9} 6 ${(v<50?-1:1)*(flip?-1:1)*9} 6z" fill="#fff" fill-opacity=".85"/>`;
    nums+=`<text x="${X(v)}" y="${H-78}" font-size="46" font-weight="800" fill="#fff" fill-opacity=".9" text-anchor="middle" font-family="'Saira Condensed','Arial Narrow',Arial,sans-serif">${t}</text>`+tri(X(v),H-94,false);
    nums+=`<g transform="rotate(180 ${X(v)} 78)"><text x="${X(v)}" y="94" font-size="46" font-weight="800" fill="#fff" fill-opacity=".9" text-anchor="middle" font-family="'Saira Condensed','Arial Narrow',Arial,sans-serif">${t}</text>${tri(X(v),78,true)}</g>`}
  const endzone=(x,c,abbr,rot)=>`<g><rect x="${x+6}" y="10" width="88" height="${H-20}" rx="6" fill="${c}" fill-opacity=".9"/>
    <rect x="${x+6}" y="10" width="88" height="${H-20}" rx="6" fill="url(#ezsh${id})"/>
    <rect x="${x+6}" y="10" width="88" height="${H-20}" rx="6" fill="none" stroke="${c}" stroke-width="9" filter="url(#glow${id})"/>
    <rect x="${x+6}" y="10" width="88" height="${H-20}" rx="6" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2"/>
    <text x="${x+50}" y="${H/2}" font-size="${nick(abbr).length>8?52:66}" font-weight="900" fill="#fff" text-anchor="middle" dominant-baseline="central" letter-spacing="2" transform="rotate(${rot} ${x+50} ${H/2})" font-family="'Saira Condensed','Arial Narrow',Arial,sans-serif" stroke="rgba(0,0,0,.35)" stroke-width="1.5">${nick(abbr)}</text>
    <text x="${x+50}" y="40" font-size="26" font-weight="800" fill="#fff" fill-opacity=".85" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif">${abbr}</text>
    <text x="${x+50}" y="${H-40}" font-size="26" font-weight="800" fill="#fff" fill-opacity=".85" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif">${abbr}</text></g>`;

    for(let k=1;k<=UPCOMING_WEEKS;k++){

/* ---------- Winner & tiebreakers ---------- */
const todayET=()=>new Date().toLocaleDateString("en-CA",{timeZone:"America/New_York"});
function seasonOver(){
  if(S.pool.ended_at)return true;
  const end=S.pool.end_date;if(!end)return false;
  const weeks=weekList();
  return weeks.length>0&&todayET()>end&&weeks.every(weekDone);
}
function underdogScore(uid_){
  let sum=0;for(const pk of S.allPicks.filter(x=>x.user_id===uid_&&x.team)){const v=pickPct(pk);if(v!=null)sum+=v}
  return sum;
}
function poolWinners(){
  const st=S.standings;if(!st||st.length<2)return null;
  const alive=st.filter(r=>r.lives_left>0);
  if(alive.length===1)return{list:alive,why:"Last one standing"};
  if(!seasonOver())return null;
  let c=alive.length?alive:st;
  const tb=S.pool.tiebreaker||"split";
  if(c.length>1&&tb==="wins"){const m=Math.max(...c.map(r=>r.wins));c=c.filter(r=>r.wins===m);return{list:c,why:`${S.pool.ended_at?"Pool ended":"Season over"} · most wins (${m})`}}
  if(c.length>1&&tb==="underdog"){const sc=c.map(r=>[r,underdogScore(r.user_id)]);const m=Math.min(...sc.map(x=>x[1]));
    c=sc.filter(x=>Math.abs(x[1]-m)<0.05).map(x=>x[0]);return{list:c,why:`${S.pool.ended_at?"Pool ended":"Season over"} · underdog tiebreaker (riskiest picks)`}}
  const over=S.pool.ended_at?"Pool ended":"Season over";
  return{list:c,why:c.length>1?`${over} · co-winners`:over};
}

/* ---------- Pool chat ---------- */
S.chat={pool:null,msgs:[],channel:null,live:false};
const lastReadKey=p=>`sp_chat_read_${p}`;
const getLastRead=p=>{try{return localStorage.getItem(lastReadKey(p))||""}catch{return ""}};
const setLastRead=(p,t)=>{try{localStorage.setItem(lastReadKey(p),t)}catch{}};
function chatUnread(){
  const c=S.chat;if(!c.pool||!c.msgs.length)return false;
  const last=[...c.msgs].reverse().find(m=>m.user_id!==uid());
  return !!last&&last.created_at>getLastRead(c.pool);
}
async function startChat(poolId){
  const c=S.chat;if(c.pool===poolId)return;
  if(c.channel){try{sb.removeChannel(c.channel)}catch{}c.channel=null}
  c.pool=poolId;c.msgs=[];c.live=false;
  const{data}=await sb.from("messages").select("id,user_id,body,created_at").eq("pool_id",poolId).order("created_at",{ascending:false}).limit(150);
  if(c.pool!==poolId)return;
  c.msgs=(data||[]).reverse();
  c.channel=sb.channel(`chat-${poolId}`)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`pool_id=eq.${poolId}`},({new:m})=>{
      if(c.pool!==poolId||c.msgs.some(x=>x.id===m.id))return;c.msgs.push(m);chatChanged()})
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},({old:m})=>{
      const n=c.msgs.length;c.msgs=c.msgs.filter(x=>x.id!==m.id);if(c.msgs.length!==n)chatChanged()})
    .subscribe(st=>{c.live=st==="SUBSCRIBED"});
  chatChanged();
}
// Backup in case live updates drop: check for new messages every 20 seconds while chat is open.
setInterval(async()=>{
  const c=S.chat,r=parseRoute();
  if(!c.pool||c.live||r.tab!=="chat"||document.visibilityState!=="visible")return;
  const{data}=await sb.from("messages").select("id,user_id,body,created_at").eq("pool_id",c.pool).order("created_at",{ascending:false}).limit(150);
  if(data){c.msgs=data.reverse();chatChanged()}
},20000);
function chatChanged(){
  const r=parseRoute();

  else{const tabs=document.querySelectorAll("nav a");tabs.forEach(a=>{if(a.getAttribute("href")?.endsWith("/chat"))a.classList.toggle("dot",chatUnread())})}
}
function markChatRead(){const c=S.chat;if(c.pool&&c.msgs.length)setLastRead(c.pool,c.msgs[c.msgs.length-1].created_at)}
const chatName=id=>{const r=S.standings.find(x=>x.user_id===id);return r?(r.display_name||"Player"):"Former player"};

  })();

  // Text an invite link
  const textPanel=el("div",{class:"panel"},el("h3",{text:"Text an invite"}),
    el("p",{class:"meta",style:"margin:0 0 12px",text:"Send your players a link by text. They tap it, pick a team name and password, and they’re in. No email needed."}));
  const linkBox=el("input",{type:"text",readonly:true,value:"Getting your link…","aria-label":"Invite link",style:"font-size:14px"});
  const textBtn=el("button",{class:"btn",text:"💬 Text invite"}),copyBtn=el("button",{class:"btn",style:"background:var(--boards)",text:"Copy link"});
  const resetBtn=el("button",{class:"sm",text:"Make a new link"});
  let link="";
  const loadLink=async reset=>{const{data,error}=await sb.rpc("pool_invite_code",{p:po.id,reset:!!reset});
    if(error){linkBox.value="Couldn’t get the link";return toast(errText(error))}
    link=location.origin+location.pathname+"#join/"+data;linkBox.value=link};
  const message=()=>`🏆 You’re invited to ${po.name}!\n\nTap to pick your team name and join:\n${link}`;
  textBtn.onclick=async()=>{if(!link)return;
    if(navigator.share){try{await navigator.share({title:po.name,text:message()});return}catch(e){if(e&&e.name==="AbortError")return}}
    location.href="sms:?&body="+encodeURIComponent(message())};
  copyBtn.onclick=async()=>{if(!link)return;try{await navigator.clipboard.writeText(message());toast("Copied. Paste it into a text.")}catch{linkBox.select();toast("Select the link and copy it")}};
  resetBtn.onclick=async()=>{await loadLink(true);toast("New link made. The old one won’t work anymore.")};
  textPanel.append(el("div",{class:"row",style:"gap:8px;flex-wrap:wrap"},textBtn,copyBtn),
    el("div",{style:"margin-top:10px"},linkBox),
    el("div",{style:"margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px"},
      el("small",{class:"meta",text:"Anyone with this link can join, so only send it to your players."}),resetBtn));
  v.append(textPanel);loadLink();

  // Invites
  const email=el("input",{type:"email",placeholder:"friend@example.com","aria-label":"Email to invite"});
  const send=el("button",{class:"btn",text:"Send invite"});
  send.onclick=async()=>{const e=email.value.trim();if(!e)return email.focus();send.disabled=true;
    const{data,error}=await sb.functions.invoke("send-invite",{body:{pool_id:po.id,email:e}});
    send.disabled=false;
    let msg=error?errText(error):data&&data.error;
    if(error&&error.context&&error.context.json){try{msg=(await error.context.json()).error||msg}catch{}}
    if(msg)return toast(msg);
    toast(data.status==="existing_user"?`Invite sent. ${e} already has an account and will see it when they sign in.`:`Invite emailed to ${e}`);
    email.value="";refresh()};
  const inv=el("div",{class:"panel"},el("h3",{text:"Or invite by email"}),
    el("p",{class:"meta",style:"margin:0 0 12px",text:"They’ll get an email with a link to join. The link doesn’t expire. If it doesn’t arrive, check their Junk folder or text them the link instead."}),
    el("div",{class:"row"},email,send));
  if(S.pending.length){
    inv.append(el("p",{style:"font-weight:600;margin:16px 0 6px",text:"Waiting to join"}));
    for(const p of S.pending){
      inv.append(el("div",{class:"prow"},el("div",{class:"top"},
        el("div",{},el("div",{text:p.email}),el("div",{class:"detail",style:"margin:0",text:`Invited ${shortDate(p.created_at.slice(0,10))}`})),
        el("button",{class:"sm danger",text:"Cancel",onclick:async()=>{await sb.from("invites").delete().eq("id",p.id);toast("Invite cancelled");refresh()}}))));
    }
  }
  v.append(inv);

  // Players + strikes
  const pl=el("div",{class:"panel"},el("h3",{text:"Players and strikes"}),
    el("p",{class:"meta",style:"margin:0 0 10px",text:isOwner()?"Tap “Make co-commissioner” to share the Commish tab with someone. They can do everything here except delete the pool or change co-commissioners.":"You’re a co-commissioner. You can do everything here except delete the pool or change co-commissioners."}));
  for(const r of [...S.standings].sort((a,b)=>(a.display_name||"").localeCompare(b.display_name||""))){
    const adjust=async delta=>{const{error}=await sb.rpc("adjust_strike",{p:po.id,u:r.user_id,delta});if(error)return toast(errText(error));toast(delta>0?"Strike added":"Strike given back");refresh()};
    const add=el("button",{class:"sm",text:"Add strike",onclick:()=>adjust(1)});
    const back=el("button",{class:"sm",text:"Give strike back",onclick:()=>adjust(-1)});
    back.disabled=r.strikes<=0;
    const acts=el("div",{class:"acts"},add,back);
    const rOwner=r.user_id===po.commissioner_id,rCo=isCoOf(po,r.user_id);
    if(isOwner()&&r.user_id!==uid()){
      const co=el("button",{class:"sm",text:rCo?"Remove co-commissioner":"Make co-commissioner"});
      co.onclick=async()=>{co.disabled=true;const{error}=await sb.rpc("set_co_commissioner",{p:po.id,u:r.user_id,on_:!rCo});
        if(error){co.disabled=false;return toast(errText(error))}
        toast(rCo?`${r.display_name} is no longer a co-commissioner`:`${r.display_name} is now a co-commissioner`);refresh()};
      acts.append(co);
    }
    if(r.user_id!==uid()&&!rOwner&&(isOwner()||!rCo)){
      const rm=el("button",{class:"sm danger",text:"Remove player"});
      rm.onclick=async()=>{if(rm.dataset.armed!=="1"){rm.dataset.armed="1";rm.textContent="Tap again to remove";return}
        const{error}=await sb.rpc("remove_member",{p:po.id,u:r.user_id});if(error)return toast(errText(error));toast("Player removed");refresh()};
      acts.append(rm);
    }
    const parts=[`${r.losses} from losses`];if(r.missed)parts.push(`${r.missed} missed`);if(r.adjust)parts.push(`${r.adjust>0?"+":""}${r.adjust} by commish`);if(r.revived)parts.push(`${r.revived} given back (everyone out)`);
    pl.append(el("div",{class:"prow"},
      el("div",{class:"top"},el("strong",{text:(r.display_name||"Player")+(r.user_id===uid()?" (you)":"")+(rOwner?" · commissioner":rCo?" · co-commissioner":"")}),puckRow(r.lives_left,po.lives)),
      el("div",{class:"detail",text:`${r.strikes} strike${r.strikes===1?"":"s"}: ${parts.join(", ")} · ${r.lives_left<=0?"eliminated":`${r.lives_left} left`}`}),acts));
  }
  v.append(pl);

  // Games + danger zone
  const sync=el("button",{class:"sm",text:"Refresh games and odds"});
  sync.onclick=async()=>{sync.disabled=true;const{data,error}=await sb.functions.invoke("sync-games",{body:{}});sync.disabled=false;
    if(error||!data||!data.ok)return toast("Couldn’t refresh games right now.");toast("Games refreshed");refresh()};
  const del=el("button",{class:"sm danger",text:"Delete this pool"});
  del.onclick=async()=>{if(del.dataset.armed!=="1"){del.dataset.armed="1";del.textContent="Tap again to delete for everyone";return}
    const{error}=await sb.from("pools").delete().eq("id",po.id);if(error)return toast(errText(error));toast("Pool deleted");location.hash="#home"};
  v.append(el("div",{class:"panel"},el("h3",{text:"Games"}),
    el("p",{class:"meta",style:"margin:0 0 12px",text:"Games, scores and odds update on their own every 5 minutes. Refresh if you need them sooner."}),
    el("div",{class:"acts"},sync)));

  // Bye weeks: the commissioner picks weeks where nobody has to pick.
  {
    const nfl=po.sport==="nfl",dayName=nfl?"Sunday":"Saturday",dow=nfl?0:6;
    const fmt=x=>nfl?`${(S.games.find(g=>g.game_date===x)||{}).week_label||"Week"} · ${shortDate(x)}`:new Date(x+"T12:00:00").toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"});
    const setBye=async(d,on)=>{const{error}=await sb.rpc("set_bye_week",{p:po.id,d,on_:on});
      if(error)return toast(errText(error));toast(on?"Bye week added":"Bye week removed");refresh()};
    const list=el("div",{class:"byelist"});
    for(const x of [...(po.bye_weeks||[])].sort())list.append(el("span",{class:"chip"},`🛋️ ${fmt(x)}`,
      el("button",{"aria-label":`Remove bye week ${x}`,text:"×",onclick:()=>setBye(x,false)})));
    const date=el("input",{type:"date",min:todayET()});
    const add=el("button",{class:"btn",text:"Add bye week"});
    add.onclick=()=>{const x=date.value;if(!x)return date.focus();
      if(new Date(x+"T12:00:00").getDay()!==dow)return toast(`Pick a ${dayName}${nfl?" (NFL weeks are filed under their Sunday)":""}.`);
      setBye(x,true)};
    // Quick buttons for loaded weeks that haven't started
    const quick=el("div",{class:"acts",style:"margin-top:10px"});
    for(const x of weekList())if(!isBye(x)&&!gamesOn(x).some(started))quick.append(el("button",{class:"sm",text:`Make ${fmt(x)} a bye`,onclick:()=>setBye(x,true)}));
    v.append(el("div",{class:"panel"},el("h3",{text:"Bye weeks"}),
      el("p",{class:"meta",style:"margin:0 0 12px",text:`Pick a ${dayName} when nobody has to make a pick. Nobody loses a life and no team gets used up. Any picks already made for that ${nfl?"week":"Saturday"} are cleared.`}),
      (po.bye_weeks||[]).length?list:el("p",{class:"meta",style:"margin:0 0 12px",text:"No bye weeks set."}),
      el("div",{class:"row"},date,add),quick));
  }

  // End the pool: freezes results and shows the winners. Can be reopened.
  const endBtn=el("button",{class:po.ended_at?"sm":"sm danger",text:po.ended_at?"Reopen this pool":"End this pool"});
  endBtn.onclick=async()=>{
    if(!po.ended_at&&endBtn.dataset.armed!=="1"){endBtn.dataset.armed="1";endBtn.textContent="Tap again to end the pool";return}
    const{error}=await sb.from("pools").update({ended_at:po.ended_at?null:new Date().toISOString()}).eq("id",po.id);
    if(error)return toast(errText(error));toast(po.ended_at?"Pool reopened":"Pool ended. Results are final.");refresh()};
  v.append(el("div",{class:"panel"},el("h3",{text:po.ended_at?"This pool has ended":"End the pool"}),
    el("p",{class:"meta",style:"margin:0 0 12px",text:po.ended_at
      ?`Ended ${new Date(po.ended_at).toLocaleDateString([], {month:"long",day:"numeric",year:"numeric"})}. Picks are closed and everyone sees the final results. You can reopen it if you ended it by mistake.`
      :"Closes all picks, freezes the standings, and shows the winner to everyone. Weeks after today won’t count. Players can still see their history."}),
    el("div",{class:"acts"},endBtn)));
  if(isOwner())v.append(el("div",{class:"panel"},el("h3",{text:"Delete the pool"}),
    el("p",{class:"meta",style:"margin:0 0 12px",text:"Permanently removes the pool, its players’ picks and its history for everyone. This can’t be undone."}),
    el("div",{class:"acts"},del)));
}

/* ---------- Start ---------- */
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{})}
// Auto-update: when a newer version of the site is published, reload into it.
// Checks when the app opens or comes back to the foreground (at most once a minute).
(function(){
  const mine=(document.querySelector('meta[name="app-version"]')||{}).content||"";
  let lastCheck=0;
  async function check(){
    if(location.protocol!=="https:"||Date.now()-lastCheck<60000)return;
    lastCheck=Date.now();
    try{
      const r=await fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"});
      const m=(await r.text()).match(/name="app-version" content="([^"]+)"/);
      if(m&&mine&&m[1]!==mine){
        const a=document.activeElement;if(a&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT")&&a.value)return; // don't lose typing
        location.replace(location.pathname+"?v="+encodeURIComponent(m[1])+location.hash);
      }
    }catch{}
  }
  check();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check()});
})();
(async()=>{
  if(!configured)return route();
  sb.auth.onAuthStateChange((event,session)=>{
    const was=S.session&&S.session.user.id;S.session=session;
    if(event==="PASSWORD_RECOVERY")S.needsPassword=true;
    if(event==="SIGNED_OUT"){S.pool=null;S.loadedPool=null}
    if((session&&session.user.id)!==was)setTimeout(route,0);
  });
  const{data}=await sb.auth.getSession();S.session=data.session;
  if(/access_token|error_description/.test(location.hash)){
    const err=new URLSearchParams(location.hash.slice(1)).get("error_description");
    history.replaceState(null,"",location.pathname+location.search+"#home");
    if(err){
      if(S.session)toast("That email link was already used, but you’re signed in, so you’re all set.");
      else S.authMsg={text:/expired|invalid/i.test(err)
        ?"That email link has already been used or has expired. Sign in with your email and password, or tap “Forgot password?” for a fresh link. Invited to a pool? Ask your commissioner to text you the invite link."
        :err.replace(/\+/g," ")};
    }
  }
  route();
  setInterval(()=>{const r=parseRoute();if(document.visibilityState==="visible"&&S.session&&r.view==="pool"&&r.tab!=="commish"&&r.tab!=="chat")refresh()},60000);
})();
</script>
