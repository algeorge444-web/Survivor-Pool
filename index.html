<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Survivor Pools</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ice:#EEF3F6;--surface:#FFFFFF;--boards:#12263A;--ink:#12263A;--muted:#5B6B7A;
  --line:#D5DEE5;--red:#D7262E;--blue:#2453A6;--crease:#CFE2F2;--good:#1D7A4A;--chip:#E3EAF0;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --ice:#0E1A26;--surface:#15263A;--boards:#08121C;--ink:#E6EEF4;--muted:#93A6B6;
  --line:#26394D;--red:#F0474E;--blue:#6E9BEA;--crease:#1C3550;--good:#4CC28A;--chip:#1E3247;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ice);color:var(--ink);font:16px/1.5 Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--boards)}
h1,h2,h3{font-family:"Saira Condensed","Arial Narrow",Arial,sans-serif}
button{font:inherit;color:inherit}
a{color:var(--blue)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}

header{background:var(--boards);color:#fff;padding:18px 18px 0}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header h1{margin:0;font-size:2.3rem;line-height:1;font-weight:800}
header .sub{color:#A9BCCD;margin:6px 0 14px;font-size:.95rem}
header .acct{flex:none;white-space:nowrap;text-align:right;font-size:.88rem;color:#A9BCCD}
header .acct button{background:none;border:1px solid #3A5168;color:#fff;border-radius:6px;padding:3px 10px;margin-top:4px;cursor:pointer}
header .back{color:#A9BCCD;text-decoration:none;font-size:.9rem;display:inline-block;margin-bottom:6px}
.redline{height:6px;background:var(--red);margin:0 -18px}
nav{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:1 0 auto;text-align:center;padding:10px 3px 12px;font-size:.76rem;white-space:nowrap;color:#A9BCCD;text-decoration:none;font-weight:600;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:#fff;border-color:#fff}

main{padding:18px 18px 48px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px;color:var(--muted)}
.note strong{color:var(--ink)}
.warn{border-color:var(--red)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.panel h3{margin:0 0 10px;font-size:1.35rem}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-weight:600;font-size:.92rem;margin-bottom:4px}
.field input,.field select,.row input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ice);color:var(--ink);font:inherit}
.check{display:flex;gap:10px;align-items:center;margin:0 0 14px;font-weight:600;font-size:.92rem}
.check input{width:20px;height:20px;flex:none;margin-top:2px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%}
.links{display:flex;justify-content:space-between;margin-top:14px;font-size:.92rem}
.links button{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;text-decoration:underline}
.err{color:var(--red);font-size:.92rem;margin:0 0 10px}
.ok{color:var(--good);font-size:.92rem;margin:0 0 10px}

.poolcard{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--ink)}
.poolcard strong{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:1.4rem;font-weight:700;display:block;line-height:1.1}
.poolcard small{color:var(--muted)}
.badge{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}

.me{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.me .who{font-weight:600}
.me .used{color:var(--muted);font-size:.9rem}
.pucks{display:flex;gap:6px}
.puck{width:22px;height:22px;border-radius:50%;background:var(--ink);box-shadow:inset 0 -4px 0 rgba(255,255,255,.18)}
.puck.lost{background:transparent;border:2px dashed var(--line);box-shadow:none}
td .puck,.prow .puck{width:14px;height:14px}

.weekbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.weekbar h2{margin:0;font-size:1.6rem;font-weight:700}
.weekbar button{background:none;border:1px solid var(--line);border-radius:8px;width:40px;height:40px;cursor:pointer}
.weekbar button:disabled{opacity:.35;cursor:default}
.meta{color:var(--muted);font-size:.88rem;margin:-6px 0 14px}

.game{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.game .top{display:flex;justify-content:space-between;padding:10px 14px 0;color:var(--muted);font-size:.85rem}
.sides{display:grid;grid-template-columns:1fr 1fr}
.side{background:none;border:0;padding:10px 14px 12px;text-align:left;cursor:pointer}
.side.home{text-align:right}
.side:disabled{cursor:default}
.side .abbr{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:2rem;font-weight:800;line-height:1;display:block}
.side .name{font-size:.85rem;color:var(--muted);display:block}
.side .pct{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:1.25rem;font-weight:700}
.side .tag{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:6px;background:var(--chip);color:var(--muted)}
.side.picked{background:var(--crease);box-shadow:inset 0 0 0 3px var(--blue)}
.side.picked .tag{background:var(--blue);color:#fff}
.game.has-pick .side:not(.picked){opacity:.5}
.game.has-pick{border-color:var(--blue)}
.mypick{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--blue);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.mypick .lbl{font-size:.8rem;font-weight:600;color:var(--blue);text-transform:none}
.mypick strong{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:1.45rem;line-height:1.1;display:block}
.mypick small{color:var(--muted)}
.mypick.none{border-style:dashed;border-color:var(--line)}
.mypick.none .lbl{color:var(--muted)}
.matchup{border-top:1px solid var(--line)}
.matchup summary{cursor:pointer;list-style:none;padding:10px 14px;font-size:.88rem;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.matchup summary::-webkit-details-marker{display:none}
.matchup summary b{color:var(--ink);font-weight:600}
.matchup summary::after{content:"Show ▾";color:var(--blue);font-weight:600;white-space:nowrap}
.matchup[open] summary::after{content:"Hide ▴"}
.mtable{width:100%;border:0;border-radius:0;background:none;font-size:.88rem}
.mtable th,.mtable td{padding:6px 14px;border-bottom:1px solid var(--line);text-align:center}
.mtable td:first-child,.mtable th:first-child{text-align:left;color:var(--muted);font-weight:500}
.mtable .better{font-weight:700;color:var(--good)}
.edge{padding:10px 14px 12px;font-size:.9rem}
.potw{display:flex;align-items:center;gap:12px}
.potw strong{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:1.4rem;line-height:1.1;display:block}
.potw small{color:var(--muted);display:block}
.potw+.potw{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

.pkrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.pkrow:first-of-type{border-top:0;padding-top:0}
.pkrow .who{flex:1;min-width:0}
.pkrow .who strong{display:block}
.pkrow .who small{color:var(--muted)}
.pkrow .pk{display:flex;align-items:center;gap:8px;justify-content:flex-end;text-align:right}
.pkrow .pk small{display:block;color:var(--muted)}
.pkrow .pk strong{display:block}
.res{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.res.w{background:var(--good);color:#fff}.res.l{background:var(--red);color:#fff}
.popular{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.popular span{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:99px;padding:3px 10px 3px 4px;font-weight:600;font-size:.88rem}
.popular .logo{width:22px;height:22px}
.friendly{display:inline-flex;align-items:center;gap:6px;background:#F5C542;color:#12263A;font-weight:700;font-size:.82rem;padding:3px 10px;border-radius:99px;margin:-6px 0 14px}
.badge.friendly-b{background:#F5C542;color:#12263A}
.winner{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#F5C542,#E9A920);color:#12263A;border-radius:12px;padding:14px 16px;margin-bottom:16px}
.winner .cup{font-size:2.2rem;line-height:1}
.winner strong{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:1.5rem;line-height:1.1;display:block}
.winner small{display:block;font-weight:600;opacity:.85}
.rulesdrop{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.rulesdrop summary{cursor:pointer;list-style:none;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.rulesdrop summary::-webkit-details-marker{display:none}
.rulesdrop summary::after{content:"Show ▾";color:var(--blue);font-size:.88rem}
.rulesdrop[open] summary::after{content:"Hide ▴"}
.rulesdrop[open] summary{border-bottom:1px solid var(--line)}
.rulesbody{padding:14px 16px 4px}
.rulesbody .panel{border:0;padding:0;margin-bottom:16px;background:none}
.rulestext{white-space:pre-wrap;margin:0;line-height:1.55}
.ruleslist{margin:0;padding-left:20px}
.ruleslist li{margin:6px 0}
textarea.rules{width:100%;min-height:180px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ice);color:var(--ink);font:inherit;resize:vertical}
.xlink{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600;margin-top:8px;background:var(--ice)}
.xlink small{display:block;color:var(--muted);font-weight:400}
.side.used .abbr,.side.used .pct,.side.used .logo{opacity:.35}
.side{display:flex;align-items:center;gap:12px}
.side.home{flex-direction:row-reverse}
.side .info{min-width:0;flex:1}
.logo{width:48px;height:48px;flex:none;display:block}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
img.logo{object-fit:contain}
.logo.logo-sm{width:32px;height:32px}
.pickrow{display:flex;align-items:center;gap:10px}
.side.won .tag{background:var(--good);color:#fff}
.side.lost .tag{background:var(--red);color:#fff}
.bar{display:flex;height:10px;position:relative}
.bar span{display:block;height:100%}
.bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--red);transform:translateX(-1px)}
.score{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.1rem;color:var(--ink)}

table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.85rem}
tr:last-child td{border-bottom:0}
tr.out td{opacity:.5}
.tablewrap{overflow-x:auto}
.hist{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.hist span{font-size:.72rem;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--chip)}
.hist .w{background:var(--good);color:#fff}
.hist .l{background:var(--red);color:#fff}

.prow{border-top:1px solid var(--line);padding:12px 0}
.prow:first-of-type{border-top:0;padding-top:0}
.prow .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prow .detail{color:var(--muted);font-size:.85rem;margin:2px 0 8px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.sm{border:1px solid var(--line);background:var(--ice);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:.88rem;font-weight:600}
.sm.danger{color:var(--red)}
.sm:disabled{opacity:.4;cursor:default}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--boards);color:#fff;padding:10px 16px;border-radius:8px;font-size:.92rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

function teamLogo(team,small){
  const sport=(S.pool&&S.pool.sport)||"nhl", cls="logo"+(small?" logo-sm":"");
  if(sport==="nfl")return el("img",{class:cls,src:`https://a.espncdn.com/i/teamlogos/nfl/500/${team.toLowerCase()}.png`,alt:"",loading:"lazy",onerror:e=>e.target.remove()});

const S={session:null,needsPassword:AUTH_TYPE==="invite"||AUTH_TYPE==="recovery",authMode:"signin",authMsg:null,

}[S.pool.lock_mode]||"Each pick is revealed when its game starts.");

const gameFor=(d,t)=>gamesOn(d).find(g=>g.away===t||g.home===t);
const weekDone=d=>{const gs=gamesOn(d);return gs.length>0&&gs.every(g=>g.status==="final"||g.status==="postponed")};
const resultOf=(d,t)=>{const g=gameFor(d,t);return g&&g.status==="final"&&g.winner?(g.winner===t?"w":"l"):"p"};
// Result of a saved pick, using the exact game it was made on (games can move weeks).
const pickGame=pk=>pk&&pk.game_id!=null?S.games.find(x=>String(x.id)===String(pk.game_id)):null;
const pickResult=pk=>{const g=pickGame(pk);if(!g)return"p";if(g.status==="postponed"||g.game_date!==pk.game_date)return"pp";
  return g.status==="final"&&g.winner?(g.winner===pk.team?"w":"l"):"p"};
const resLabel=r=>({w:"Won",l:"Lost",pp:"Postponed · no strike",p:"Pending"})[r];
const resClass=r=>r==="pp"?"w":r==="p"?"":r;
const pickPct=pk=>{const g=pickGame(pk);if(!g)return null;const v=g.away===pk.team?g.away_pct:g.home_pct;return v==null?null:+v};

function puckRow(left,total){const r=el("div",{class:"pucks","aria-label":`${left} of ${total} lives left`});for(let i=0;i<total;i++)r.append(el("span",{class:"puck"+(i<left?"":" lost")}));return r}

/* ---------- Routing ---------- */
function parseRoute(){const p=location.hash.slice(1).split("/");if(p[0]==="pool"&&p[1])return{view:"pool",id:p[1],tab:["saturday","picks","standings","commish"].includes(p[2])?p[2]:"mine"};return{view:"home"}}

async function route(){
  if(!configured)return renderSetupNeeded();
  if(!S.session)return renderAuth();
  if(S.needsPassword)return renderSetPassword();
  const r=parseRoute();
  if(r.view==="pool"){
    if(S.loadedPool!==r.id){renderHeader(null);$("app").replaceChildren(el("p",{class:"meta",text:"Loading pool…"}));await loadPool(r.id)}
    if(!S.pool){location.hash="#home";return}
    renderPool(r.tab);
  }else{
    S.loadedPool=null;S.pool=null;
    renderHeader(null);
    await loadHome();renderHome();
  }
}
addEventListener("hashchange",route);

/* ---------- Pool data ---------- */
async function loadPool(id,quiet){
  const{data:pool,error}=await sb.from("pools").select("*").eq("id",id).maybeSingle();
  if(error||!pool){S.pool=null;S.loadedPool=null;if(!quiet)toast("You don’t have access to that pool.");return}
  const isC=pool.commissioner_id===uid();
  const [games,mine,st,all,pend,ts]=await Promise.all([
    sb.from("games").select("*").eq("sport",pool.sport||"nhl").gte("game_date",pool.start_date).order("game_date").order("start_time"),
    sb.from("picks").select("game_date,team,game_id").eq("pool_id",id).eq("user_id",uid()),
    sb.rpc("pool_standings",{p:id}),
    sb.rpc("pool_picks",{p:id}),
    isC?sb.from("invites").select("id,email,created_at").eq("pool_id",id).is("accepted_at",null).order("created_at"):Promise.resolve({data:[]}),
    sb.from("team_stats").select("*").eq("sport",pool.sport||"nhl")
  ]);
  const sameWeek=S.loadedPool===id;
  S.pool=pool;S.games=games.data||[];S.myPicks=mine.data||[];S.standings=st.data||[];S.allPicks=all.data||[];S.pending=pend.data||[];
  S.stats={};for(const t of ts.data||[])S.stats[t.team]=t;
  const weeks=weekList();
  if(!sameWeek||S.weekIdx<0||S.weekIdx>=weeks.length){const i=weeks.findIndex(d=>!weekDone(d));S.weekIdx=i===-1?weeks.length-1:i}
  S.loadedPool=id;
}
const slateTitle=d=>{if(S.pool&&S.pool.sport==="nfl"){const g=S.games.find(x=>x.game_date===d);return `${(g&&g.week_label)||"Week"} · ${shortDate(d)}`}return fmtDate(d)};
const weekList=()=>[...new Set(S.games.map(g=>g.game_date))].filter(d=>!S.pool||!S.pool.end_date||d<=S.pool.end_date).sort();
const isCommish=()=>S.pool&&S.pool.commissioner_id===uid();
async function refresh(){if(S.pool){await loadPool(S.pool.id,true);if(S.pool)renderPool(parseRoute().tab)}}

/* ---------- Pool views ---------- */
function renderPool(tab){
  const tabs=[["mine","Your Picks"],["picks","All Picks"],["standings","Standings"],["saturday",sportOf().tab]];
  if(isCommish())tabs.push(["commish","Commish"]);
  if(tab==="commish"&&!isCommish())tab="mine";
  renderHeader(tabs);
  const app=$("app");app.replaceChildren();
  // Pool rules: a drop-down at the top of every pool page
  const box=el("div",{class:"rulesbody"});renderRules(box);
  const drop=el("details",{class:"rulesdrop"},el("summary",{},el("span",{text:"📋 Pool rules"})),box);
  if(S.rulesOpen)drop.open=true;
  drop.addEventListener("toggle",()=>{S.rulesOpen=drop.open});
  app.append(drop);
  if(tab==="standings")renderStandings(app);
  else if(tab==="picks")renderAllPicks(app);
  else if(tab==="mine")renderMine(app);
  else if(tab==="commish")renderCommish(app);
  else if(tab==="saturday")renderSaturday(app);
  else renderMine(app);
}

function renderSaturday(v){
  const me=S.standings.find(r=>r.user_id===uid());
  const limit=S.pool.max_picks_per_team;
  const counts={};for(const p of S.myPicks)counts[p.team]=(counts[p.team]||0)+1;
  if(me){
    v.append(el("div",{class:"me"},
      el("div",{},el("div",{class:"who",text:me.display_name||"You"}),
        el("div",{class:"used",text:me.lives_left<=0?"Eliminated":`${Object.keys(counts).length} team${Object.keys(counts).length===1?"":"s"} used · ${me.wins} win${me.wins===1?"":"s"}`})),
      puckRow(me.lives_left,S.pool.lives)));
  }
  const weeks=weekList();
  if(!weeks.length){
    v.append(el("div",{class:"note"},el("strong",{text:S.pool.sport==="nfl"?"No NFL games yet. ":"No Saturday games yet. "}),S.pool.sport==="nfl"?"Games load automatically once the NFL schedule syncs. Odds appear during the week.":"Games load automatically once the NHL schedule syncs. Odds appear a few days before puck drop."));
    renderMyPicks(v,counts,limit);return;
  }
  const d=weeks[S.weekIdx];
  const prev=el("button",{"aria-label":`Previous ${sportOf().slate}`,text:"‹",onclick:()=>{S.weekIdx--;renderPool("saturday")}});prev.disabled=S.weekIdx<=0;
  const next=el("button",{"aria-label":`Next ${sportOf().slate}`,text:"›",onclick:()=>{S.weekIdx++;renderPool("saturday")}});next.disabled=S.weekIdx>=weeks.length-1;
  v.append(el("div",{class:"weekbar"},prev,el("h2",{text:slateTitle(d)}),next));
  const gs=gamesOn(d);
  const oddsAt=gs.map(g=>g.odds_updated_at).filter(Boolean).sort().pop();
  v.append(el("p",{class:"meta",text:(oddsAt?`Odds updated ${new Date(oddsAt).toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"})}. `:"")+lockText()}));

  const myPickRow=S.myPicks.find(p=>p.game_date===d);
  const myPick=myPickRow&&myPickRow.team;
  const myGame=myPickRow?pickGame(myPickRow)||gameFor(d,myPick):null;
  const myRes=myPickRow?pickResult(myPickRow):null;
  const canRepick=myRes==="pp"&&S.pool.postponed_rule==="repick";
  const pickLocked=myGame&&!canRepick&&locked(d,myGame);
  const alive=me&&me.lives_left>0;

  renderWinner(v);
  // Banner: your pick for this week, or a nudge to make one
  if(me&&myPick){
    const pg=myGame;const pct=pg?(pg.away===myPick?pg.away_pct:pg.home_pct):null;
    const res=myRes==="pp"?(canRepick?"Your game was postponed. Pick another team below.":"Your game was postponed. It counts as a win."):pg&&pg.status==="final"&&pg.winner?(pg.winner===myPick?"Won ✓":"Lost"):pickLocked?"Locked in":"You can change it until it locks";
    v.append(el("div",{class:"mypick"},teamLogo(myPick),
      el("div",{},el("div",{class:"lbl",text:"✓ Your pick"}),el("strong",{text:teamName(myPick)}),
        el("small",{text:`${pct!=null?`${Math.round(pct)}% to win · `:""}${res}`}))));
  }else if(me&&alive&&gs.some(g=>!locked(d,g))){
    v.append(el("div",{class:"mypick none"},el("div",{},el("div",{class:"lbl",text:"No pick yet"}),
      el("small",{text:"Tap a team below to make your pick."}))));
  }

  if(me&&alive)renderPickOfWeek(v,d,counts,limit,myPick);

  for(const g of gs){
    const card=el("div",{class:"game"+(myPick&&(g.away===myPick||g.home===myPick)?" has-pick":"")});
    const right=g.status==="postponed"?el("span",{class:"score",text:"Postponed"}):g.status==="final"?el("span",{class:"score",text:`Final ${g.away_score}–${g.home_score}${g.winner==="TIE"?" · tie":""}`}):g.status==="live"?el("span",{class:"score",text:`Live ${g.away_score??0}–${g.home_score??0}`}):el("span",{text:S.pool.sport==="nfl"?new Date(g.start_time).toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"}):fmtTime(g.start_time)});
    card.append(el("div",{class:"top"},el("span",{text:"Away @ Home"}),right));
    const sides=el("div",{class:"sides"});
    for(const [team,pct,cls] of [[g.away,g.away_pct,"away"],[g.home,g.home_pct,"home"]]){
      const isPick=myPick===team;
      const used=(counts[team]||0)-(isPick?1:0);
      const maxed=used>=limit;
      const res=isPick&&g.status==="final"&&g.winner?(g.winner===team?" won":" lost"):"";
      let tag=null;
      if(isPick)tag=res===" won"?"✓ Your pick · won":res===" lost"?"✓ Your pick · lost":"✓ Your pick";
      else if(maxed)tag=limit===2?"Used twice":"Used";
      else if(used>0)tag="Used once · 1 left";
      const canTap=alive&&g.status!=="postponed"&&(canRepick?!started(g)&&!isPick:!locked(d,g))&&!pickLocked&&(isPick||!maxed);
      const b=el("button",{class:`side ${cls}${isPick?" picked":""}${maxed&&!isPick?" used":""}${res}`,"aria-pressed":isPick?"true":"false",
        "aria-label":`${teamName(team)}${pct!=null?`, ${pct}% to win`:""}${isPick?", your pick":""}${maxed&&!isPick?", already used":""}`},
        teamLogo(team),
        el("div",{class:"info"},
          el("span",{class:"abbr",text:team}),el("span",{class:"name",text:teamName(team)}),

/* ---------- Matchup notes, pick of the week, expert links ---------- */
const recPct=r=>{if(!r)return null;const n=String(r).split("-").map(Number);const tot=n.reduce((a,b)=>a+(b||0),0);return tot?n[0]/tot:null};
const formPct=t=>{if(!t||!t.form)return null;if(t.form.includes("-"))return recPct(t.form);const w=[...t.form].filter(c=>c==="W").length;return t.form.length?w/t.form.length:null};
const recText=t=>S.pool.sport==="nfl"?`${t.wins}–${t.losses}${t.otl?`–${t.otl}`:""}`:`${t.wins}–${t.losses}–${t.otl}`;
const dash=x=>x?String(x).replace(/-/g,"–"):"—";
function matchupEdge(g){
  const A=S.stats[g.away],H=S.stats[g.home];if(!A||!H)return null;
  const nfl=S.pool.sport==="nfl",marginGap=nfl?2:0.3;
  const f=[
    [A.pct,H.pct,.05,()=>`better record (${recText(A)})`,()=>`better record (${recText(H)})`],
    [recPct(A.road),recPct(H.home),.1,()=>`good on the road (${dash(A.road)})`,()=>`strong at home (${dash(H.home)})`],
    [formPct(A),formPct(H),.15,()=>"hotter lately",()=>"hotter lately"],
    [(A.pf??0)-(A.pa??0),(H.pf??0)-(H.pa??0),marginGap,()=>"bigger scoring margin",()=>"bigger scoring margin"],
  ];
  const ra=[],rh=[];
  for(const [a,h,gap,ta,th] of f){if(a==null||h==null)continue;if(a-h>gap)ra.push(ta());else if(h-a>gap)rh.push(th())}
  if(ra.length===rh.length)return{team:null,text:"Even matchup on paper."};
  const [team,why]=ra.length>rh.length?[g.away,ra]:[g.home,rh];
  return{team,text:`${why.join(", ")}.`};
}
function matchupNotes(g){
  const A=S.stats[g.away],H=S.stats[g.home];if(!A||!H)return null;
  const nfl=S.pool.sport==="nfl",e=matchupEdge(g);
  const num=x=>x==null?"—":(+x).toFixed(nfl?1:2);
  const row=(label,a,h,cmpA,cmpH)=>{const tr=el("tr",{},el("td",{text:label}));
    const ca=el("td",{text:a}),ch=el("td",{text:h});
    if(cmpA!=null&&cmpH!=null&&cmpA!==cmpH)(cmpA>cmpH?ca:ch).classList.add("better");
    tr.append(ca,ch);return tr};
  const body=el("tbody",{},
    row("Record",recText(A),recText(H),A.pct,H.pct),
    row("Road / home",`${dash(A.road)} road`,`${dash(H.home)} home`,recPct(A.road),recPct(H.home)),
    nfl?row("Last 5 (newest first)",A.form?[...A.form].join(" "):"—",H.form?[...H.form].join(" "):"—",formPct(A),formPct(H))
       :row("Last 10",dash(A.form),dash(H.form),formPct(A),formPct(H)),
    row("Streak",A.streak||"—",H.streak||"—"),
    row(nfl?"Points scored / game":"Goals for / game",num(A.pf),num(H.pf),+A.pf,+H.pf),
    row(nfl?"Points allowed / game":"Goals against / game",num(A.pa),num(H.pa),-A.pa,-H.pa));
  return el("details",{class:"matchup"},
    el("summary",{},el("span",{},"Matchup notes",e&&e.team?el("b",{text:` · Edge: ${e.team}`}):null)),
    el("table",{class:"mtable"},el("thead",{},el("tr",{},el("th",{text:""}),el("th",{text:g.away}),el("th",{text:g.home}))),body),
    e?el("div",{class:"edge"},e.team?el("b",{text:`Edge: ${teamName(e.team)} — `}):null,e.team?e.text:e.text):null);
}
// Safest pick: highest win % (odds) among games not yet locked; falls back to records.
function pickOfWeek(d,counts,limit,myPick){
  const open=gamesOn(d).filter(g=>!locked(d,g));if(!open.length)return null;
  const hasOdds=open.some(g=>g.away_pct!=null);
  const cands=[];
  for(const g of open)for(const [team,opp,pct,home] of [[g.away,g.home,g.away_pct,false],[g.home,g.away,g.home_pct,true]]){
    let score;
    if(hasOdds){if(pct==null)continue;score=+pct}
    else{const T=S.stats[team],O=S.stats[opp];if(!T||!O)continue;score=(+T.pct-+O.pct)+(home?.05:0)}
    cands.push({team,opp,pct:hasOdds?+pct:null,score,home});
  }
  if(!cands.length)return null;
  cands.sort((a,b)=>b.score-a.score);
  const avail=c=>(counts[c.team]||0)-(myPick===c.team?1:0)<limit;
  return{best:cands[0],mine:cands.find(avail),hasOdds};
}

/* ---------- Winner & tiebreakers ---------- */
const todayET=()=>new Date().toLocaleDateString("en-CA",{timeZone:"America/New_York"});
function seasonOver(){
  const end=S.pool.end_date;if(!end)return false;
  const weeks=weekList();
  return weeks.length>0&&todayET()>end&&weeks.every(weekDone);
}
function underdogScore(uid_){
  let sum=0;for(const pk of S.allPicks.filter(x=>x.user_id===uid_&&x.team)){const v=pickPct(pk);if(v!=null)sum+=v}
  return sum;
}
function poolWinners(){
  const st=S.standings;if(!st||st.length<2)return null;
  const alive=st.filter(r=>r.lives_left>0);
  if(alive.length===1)return{list:alive,why:"Last one standing"};
  if(!seasonOver())return null;
  let c=alive.length?alive:st;
  const tb=S.pool.tiebreaker||"split";
  if(c.length>1&&tb==="wins"){const m=Math.max(...c.map(r=>r.wins));c=c.filter(r=>r.wins===m);return{list:c,why:`Season over · most wins (${m})`}}
  if(c.length>1&&tb==="underdog"){const sc=c.map(r=>[r,underdogScore(r.user_id)]);const m=Math.min(...sc.map(x=>x[1]));
    c=sc.filter(x=>Math.abs(x[1]-m)<0.05).map(x=>x[0]);return{list:c,why:"Season over · underdog tiebreaker (riskiest picks)"}}
  return{list:c,why:c.length>1?"Season over · co-winners":"Season over"};
}

  const list=el("ul",{class:"ruleslist"});for(const r of appRules())list.append(el("li",{text:r}));
  v.append(c,el("div",{class:"panel"},el("h3",{text:"How this pool works"}),
    el("p",{class:"meta",style:"margin:0 0 8px",text:"These update automatically when the commissioner changes the settings."}),list));
}

function renderCommish(v){
  const po=S.pool;
  const opt=(pairs,cur)=>pairs.map(([val,label])=>el("option",{value:val,selected:String(val)===String(cur),text:label}));
  const name=el("input",{type:"text",value:po.name,maxlength:"60"});
  const lives=el("select",{},...opt([1,2,3,4,5].map(n=>[n,`${n} ${n===1?"life":"lives"}`]),po.lives));
  const reuse=el("select",{},...opt([[1,"Once per season"],[2,"Twice per season"]],po.max_picks_per_team));
  const lockChoices=po.sport==="nfl"
    ?[["first","Before the first game of the week"],["sunday_first","Before the first Sunday game"],["sunday_1pm","Sunday at 1:00 p.m. Eastern"],["game","When each player’s picked game starts"]]
    :[["game","When each player’s picked game starts"],["first","At the first puck drop of the day"]];
  const lock=el("select",{},...opt(lockChoices,po.lock_mode));
  const missed=el("input",{type:"checkbox",checked:po.missed_pick_strike});
  const revive=el("input",{type:"checkbox",checked:po.revive_if_all_out!==false});
  const friendly=el("input",{type:"checkbox",checked:!!po.friendly});
  const postponed=el("select",{},...opt([["win","Counts as a win (no strike)"],["repick","Player can re-pick another game"]],po.postponed_rule||"win"));
  const endDate=el("input",{type:"date",value:po.end_date||""});
  const tiebreak=el("select",{},...opt([["split","Co-winners share the title"],["wins","Most wins, then co-winners"],["underdog","Underdog: riskiest picks win"]],po.tiebreaker||"split"));
  const save=el("button",{class:"btn",text:"Save settings"});
  save.onclick=async()=>{save.disabled=true;
    const{error}=await sb.from("pools").update({name:name.value.trim()||po.name,lives:+lives.value,max_picks_per_team:+reuse.value,lock_mode:lock.value,reveal_picks:"start",missed_pick_strike:missed.checked,revive_if_all_out:revive.checked,friendly:friendly.checked,postponed_rule:postponed.value,end_date:endDate.value||null,tiebreaker:tiebreak.value}).eq("id",po.id);
    save.disabled=false;if(error)return toast(errText(error));toast("Settings saved");refresh()};
  v.append(el("div",{class:"panel"},el("h3",{text:"Pool settings"}),
    el("label",{class:"field"},el("span",{text:"Survivor pool name"}),name),
    el("label",{class:"field"},el("span",{text:"Lives per player"}),lives),
    el("label",{class:"field"},el("span",{text:"Each team can be picked"}),reuse),
    el("label",{class:"field"},el("span",{text:"Pick deadline"}),lock),
    el("p",{class:"meta",style:"margin:-4px 0 14px",text:"Everyone’s picks are revealed once the pick deadline passes."}),
    el("label",{class:"field"},el("span",{text:"If a picked game is postponed or cancelled"}),postponed),
    el("label",{class:"field"},el("span",{text:"Season ends (last week that counts)"}),endDate,
      el("small",{class:"meta",style:"display:block;margin-top:4px",text:po.sport==="nfl"
        ?"Pick the Sunday of the last week that counts. Week 18 ends the regular season in early January; choose a later date to include the playoffs. Leave blank to keep going."
        :"Pick the last Saturday that counts. The regular season ends in mid-April; choose a later date to include the playoffs. Leave blank to keep going."})),
    el("label",{class:"field"},el("span",{text:"If more than one player is left when the season ends"}),tiebreak),
    el("label",{class:"check"},missed,`A missed ${sportOf().slate} costs a life`),
    el("label",{class:"check",style:"align-items:flex-start"},revive,el("span",{},`If everyone still in is knocked out in the same ${sportOf().slate}, they all get that life back`)),
    el("label",{class:"check",style:"align-items:flex-start"},friendly,el("span",{},"🏆 Friendly pool: no money, playing for bragging rights (shows a badge to everyone)")),
    save));

  // Rules box: everyone sees this in the "Pool rules" drop-down
  const rules=el("textarea",{class:"rules",maxlength:"5000",placeholder:"e.g. $20 entry, winner takes all. Postponed games count as a win. Buy-backs allowed until Week 4."});
  rules.value=po.rules||"";
  const saveRules=el("button",{class:"btn",text:"Save rules"});
  saveRules.onclick=async()=>{saveRules.disabled=true;
    const{error}=await sb.from("pools").update({rules:rules.value.trim()}).eq("id",po.id);
    saveRules.disabled=false;if(error)return toast(errText(error));toast("Rules saved");refresh()};
  v.append(el("div",{class:"panel"},el("h3",{text:"Pool rules"}),
    el("p",{class:"meta",style:"margin:0 0 10px",text:"Everyone in the pool sees these under “Pool rules” at the top of the pool, along with a summary of your settings."}),
    rules,el("div",{style:"margin-top:10px"},saveRules)));

  // Invites
  const email=el("input",{type:"email",placeholder:"friend@example.com","aria-label":"Email to invite"});
  const send=el("button",{class:"btn",text:"Send invite"});
  send.onclick=async()=>{const e=email.value.trim();if(!e)return email.focus();send.disabled=true;
    const{data,error}=await sb.functions.invoke("send-invite",{body:{pool_id:po.id,email:e}});
    send.disabled=false;
    let msg=error?errText(error):data&&data.error;
    if(error&&error.context&&error.context.json){try{msg=(await error.context.json()).error||msg}catch{}}
    if(msg)return toast(msg);
    toast(data.status==="existing_user"?`Invite sent. ${e} already has an account and will see it when they sign in.`:`Invite emailed to ${e}`);
    email.value="";refresh()};
  const inv=el("div",{class:"panel"},el("h3",{text:"Invite players"}),
    el("p",{class:"meta",style:"margin:0 0 12px",text:"They’ll get an email with a link to join and set a password."}),
    el("div",{class:"row"},email,send));
  if(S.pending.length){
    inv.append(el("p",{style:"font-weight:600;margin:16px 0 6px",text:"Waiting to join"}));
    for(const p of S.pending){
      inv.append(el("div",{class:"prow"},el("div",{class:"top"},
        el("div",{},el("div",{text:p.email}),el("div",{class:"detail",style:"margin:0",text:`Invited ${shortDate(p.created_at.slice(0,10))}`})),
        el("button",{class:"sm danger",text:"Cancel",onclick:async()=>{await sb.from("invites").delete().eq("id",p.id);toast("Invite cancelled");refresh()}}))));
    }
  }
  v.append(inv);

  // Players + strikes
  const pl=el("div",{class:"panel"},el("h3",{text:"Players and strikes"}));
  for(const r of [...S.standings].sort((a,b)=>(a.display_name||"").localeCompare(b.display_name||""))){
    const adjust=async delta=>{const{error}=await sb.rpc("adjust_strike",{p:po.id,u:r.user_id,delta});if(error)return toast(errText(error));toast(delta>0?"Strike added":"Strike given back");refresh()};
    const add=el("button",{class:"sm",text:"Add strike",onclick:()=>adjust(1)});
    const back=el("button",{class:"sm",text:"Give strike back",onclick:()=>adjust(-1)});
    back.disabled=r.strikes<=0;
    const acts=el("div",{class:"acts"},add,back);
    if(r.user_id!==uid()){
      const rm=el("button",{class:"sm danger",text:"Remove player"});
      rm.onclick=async()=>{if(rm.dataset.armed!=="1"){rm.dataset.armed="1";rm.textContent="Tap again to remove";return}
        const{error}=await sb.rpc("remove_member",{p:po.id,u:r.user_id});if(error)return toast(errText(error));toast("Player removed");refresh()};
      acts.append(rm);
    }
    const parts=[`${r.losses} from losses`];if(r.missed)parts.push(`${r.missed} missed`);if(r.adjust)parts.push(`${r.adjust>0?"+":""}${r.adjust} by you`);if(r.revived)parts.push(`${r.revived} given back (everyone out)`);
    pl.append(el("div",{class:"prow"},
      el("div",{class:"top"},el("strong",{text:(r.display_name||"Player")+(r.user_id===uid()?" (you)":"")}),puckRow(r.lives_left,po.lives)),
      el("div",{class:"detail",text:`${r.strikes} strike${r.strikes===1?"":"s"}: ${parts.join(", ")} · ${r.lives_left<=0?"eliminated":`${r.lives_left} left`}`}),acts));
  }
  v.append(pl);

  // Games + danger zone
  const sync=el("button",{class:"sm",text:"Refresh games and odds"});
  sync.onclick=async()=>{sync.disabled=true;const{data,error}=await sb.functions.invoke("sync-games",{body:{}});sync.disabled=false;
    if(error||!data||!data.ok)return toast("Couldn’t refresh games right now.");toast("Games refreshed");refresh()};
  const del=el("button",{class:"sm danger",text:"Delete this pool"});
  del.onclick=async()=>{if(del.dataset.armed!=="1"){del.dataset.armed="1";del.textContent="Tap again to delete for everyone";return}
    const{error}=await sb.from("pools").delete().eq("id",po.id);if(error)return toast(errText(error));toast("Pool deleted");location.hash="#home"};
  v.append(el("div",{class:"panel"},el("h3",{text:"Games"}),
    el("p",{class:"meta",style:"margin:0 0 12px",text:"Games, scores and odds update on their own every 5 minutes. Refresh if you need them sooner."}),
    el("div",{class:"acts"},sync,del)));
}

/* ---------- Start ---------- */
(async()=>{
  if(!configured)return route();
  sb.auth.onAuthStateChange((event,session)=>{
    const was=S.session&&S.session.user.id;S.session=session;
    if(event==="PASSWORD_RECOVERY")S.needsPassword=true;
    if(event==="SIGNED_OUT"){S.pool=null;S.loadedPool=null}
    if((session&&session.user.id)!==was)setTimeout(route,0);
  });
  const{data}=await sb.auth.getSession();S.session=data.session;
  if(/access_token|error_description/.test(location.hash)){
    const err=new URLSearchParams(location.hash.slice(1)).get("error_description");
    history.replaceState(null,"",location.pathname+location.search+"#home");
    if(err)S.authMsg={text:err.replace(/\+/g," ")};
  }
  route();
  setInterval(()=>{const r=parseRoute();if(document.visibilityState==="visible"&&S.session&&r.view==="pool"&&r.tab!=="commish")refresh()},60000);
})();
</script>
