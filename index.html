<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Survivor Pools</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ice:#EEF3F6;--surface:#FFFFFF;--boards:#12263A;--ink:#12263A;--muted:#5B6B7A;
  --line:#D5DEE5;--red:#D7262E;--blue:#2453A6;--crease:#CFE2F2;--good:#1D7A4A;--chip:#E3EAF0;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --ice:#0E1A26;--surface:#15263A;--boards:#08121C;--ink:#E6EEF4;--muted:#93A6B6;
  --line:#26394D;--red:#F0474E;--blue:#6E9BEA;--crease:#1C3550;--good:#4CC28A;--chip:#1E3247;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ice);color:var(--ink);font:16px/1.5 Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--boards)}
h1,h2,h3{font-family:"Saira Condensed","Arial Narrow",Arial,sans-serif}
button{font:inherit;color:inherit}
a{color:var(--blue)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}

header{background:var(--boards);color:#fff;padding:18px 18px 0}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header h1{margin:0;font-size:2.3rem;line-height:1;font-weight:800}
header .sub{color:#A9BCCD;margin:6px 0 14px;font-size:.95rem}
header .acct{text-align:right;font-size:.88rem;color:#A9BCCD}
header .acct button{background:none;border:1px solid #3A5168;color:#fff;border-radius:6px;padding:3px 10px;margin-top:4px;cursor:pointer}
header .back{color:#A9BCCD;text-decoration:none;font-size:.9rem;display:inline-block;margin-bottom:6px}
.redline{height:6px;background:var(--red);margin:0 -18px}
nav{display:flex;gap:4px}
nav a{flex:1;text-align:center;padding:10px 0 12px;color:#A9BCCD;text-decoration:none;font-weight:600;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:#fff;border-color:#fff}

main{padding:18px 18px 48px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px;color:var(--muted)}
.note strong{color:var(--ink)}
.warn{border-color:var(--red)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.panel h3{margin:0 0 10px;font-size:1.35rem}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-weight:600;font-size:.92rem;margin-bottom:4px}
.field input,.field select,.row input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ice);color:var(--ink);font:inherit}
.check{display:flex;gap:10px;align-items:center;margin:0 0 14px;font-weight:600;font-size:.92rem}
.check input{width:20px;height:20px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%}
.links{display:flex;justify-content:space-between;margin-top:14px;font-size:.92rem}
.links button{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;text-decoration:underline}
.err{color:var(--red);font-size:.92rem;margin:0 0 10px}
.ok{color:var(--good);font-size:.92rem;margin:0 0 10px}

.poolcard{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--ink)}
.poolcard strong{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:1.4rem;font-weight:700;display:block;line-height:1.1}
.poolcard small{color:var(--muted)}
.badge{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}

.me{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.me .who{font-weight:600}
.me .used{color:var(--muted);font-size:.9rem}
.pucks{display:flex;gap:6px}
.puck{width:22px;height:22px;border-radius:50%;background:var(--ink);box-shadow:inset 0 -4px 0 rgba(255,255,255,.18)}
.puck.lost{background:transparent;border:2px dashed var(--line);box-shadow:none}
td .puck,.prow .puck{width:14px;height:14px}

.weekbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.weekbar h2{margin:0;font-size:1.6rem;font-weight:700}
.weekbar button{background:none;border:1px solid var(--line);border-radius:8px;width:40px;height:40px;cursor:pointer}
.weekbar button:disabled{opacity:.35;cursor:default}
.meta{color:var(--muted);font-size:.88rem;margin:-6px 0 14px}

.game{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.game .top{display:flex;justify-content:space-between;padding:10px 14px 0;color:var(--muted);font-size:.85rem}
.sides{display:grid;grid-template-columns:1fr 1fr}
.side{background:none;border:0;padding:10px 14px 12px;text-align:left;cursor:pointer}
.side.home{text-align:right}
.side:disabled{cursor:default}
.side .abbr{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:2rem;font-weight:800;line-height:1;display:block}
.side .name{font-size:.85rem;color:var(--muted);display:block}
.side .pct{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-size:1.25rem;font-weight:700}
.side .tag{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:6px;background:var(--chip);color:var(--muted)}
.side.picked{background:var(--crease)}
.side.picked .tag{background:var(--blue);color:#fff}
.side.used .abbr,.side.used .pct{opacity:.35}
.side.won .tag{background:var(--good);color:#fff}
.side.lost .tag{background:var(--red);color:#fff}
.bar{display:flex;height:10px;position:relative}
.bar span{display:block;height:100%}
.bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--red);transform:translateX(-1px)}
.score{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.1rem;color:var(--ink)}

table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.85rem}
tr:last-child td{border-bottom:0}
tr.out td{opacity:.5}
.tablewrap{overflow-x:auto}
.hist{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.hist span{font-size:.72rem;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--chip)}
.hist .w{background:var(--good);color:#fff}
.hist .l{background:var(--red);color:#fff}

.prow{border-top:1px solid var(--line);padding:12px 0}
.prow:first-of-type{border-top:0;padding-top:0}
.prow .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prow .detail{color:var(--muted);font-size:.85rem;margin:2px 0 8px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.sm{border:1px solid var(--line);background:var(--ice);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:.88rem;font-weight:600}
.sm.danger{color:var(--red)}
.sm:disabled{opacity:.4;cursor:default}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--boards);color:#fff;padding:10px 16px;border-radius:8px;font-size:.92rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header><div class="wrap" id="head"></div><div class="redline"></div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ======== Settings: paste your Supabase project values here ======== */
const SUPABASE_URL = "https://pqhwctrxhmdrvkkhbzbn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_oesqyjOM4Yxk3L_MTx3FfA_knGhHFpT";
/* =================================================================== */

const AUTH_TYPE = new URLSearchParams(location.hash.slice(1)).get("type");
const configured = !SUPABASE_URL.includes("YOUR-") && !SUPABASE_ANON_KEY.includes("YOUR-");
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const TEAMS={ANA:["Anaheim Ducks","#F47A38"],BOS:["Boston Bruins","#FFB81C"],BUF:["Buffalo Sabres","#003087"],CGY:["Calgary Flames","#C8102E"],CAR:["Carolina Hurricanes","#CE1126"],CHI:["Chicago Blackhawks","#CF0A2C"],COL:["Colorado Avalanche","#6F263D"],CBJ:["Columbus Blue Jackets","#002654"],DAL:["Dallas Stars","#006847"],DET:["Detroit Red Wings","#CE1126"],EDM:["Edmonton Oilers","#FF4C00"],FLA:["Florida Panthers","#C8102E"],LAK:["Los Angeles Kings","#8A8D8F"],MIN:["Minnesota Wild","#154734"],MTL:["Montreal Canadiens","#AF1E2D"],NSH:["Nashville Predators","#FFB81C"],NJD:["New Jersey Devils","#CE1126"],NYI:["New York Islanders","#00539B"],NYR:["New York Rangers","#0038A8"],OTT:["Ottawa Senators","#C52032"],PHI:["Philadelphia Flyers","#F74902"],PIT:["Pittsburgh Penguins","#FCB514"],SJS:["San Jose Sharks","#006D75"],SEA:["Seattle Kraken","#68A2B9"],STL:["St. Louis Blues","#002F87"],TBL:["Tampa Bay Lightning","#002868"],TOR:["Toronto Maple Leafs","#00205B"],UTA:["Utah Mammoth","#71AFE5"],VAN:["Vancouver Canucks","#00843D"],VGK:["Vegas Golden Knights","#B4975A"],WSH:["Washington Capitals","#C8102E"],WPG:["Winnipeg Jets","#041E42"]};
const teamName=a=>(TEAMS[a]||[a])[0];
const teamColor=a=>(TEAMS[a]||[0,"#5B6B7A"])[1];

const S={session:null,needsPassword:AUTH_TYPE==="invite"||AUTH_TYPE==="recovery",authMode:"signin",authMsg:null,
  pools:[],invites:[],pool:null,games:[],myPicks:[],standings:[],allPicks:[],pending:[],weekIdx:-1,loadedPool:null};

const $=id=>document.getElementById(id);
const el=(tag,attrs={},...kids)=>{const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")n.className=v;else if(k==="text")n.textContent=v;else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);else if(v===true)n.setAttribute(k,"");else if(v!==false&&v!=null)n.setAttribute(k,v)}for(const c of kids)if(c!=null)n.append(c);return n};
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),3000)}
const errText=e=>(e&&(e.message||e.error_description))||"Something went wrong. Try again.";
const uid=()=>S.session&&S.session.user.id;

const started=g=>g.status!=="scheduled"||Date.parse(g.start_time)<=Date.now();
const gamesOn=d=>S.games.filter(g=>g.game_date===d);
const locked=(d,g)=>S.pool.lock_mode==="first"?gamesOn(d).some(started):started(g);
const fmtTime=iso=>new Date(iso).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
const fmtDate=d=>new Date(d+"T12:00:00").toLocaleDateString([], {weekday:"long",month:"long",day:"numeric"});
const shortDate=d=>new Date(d+"T12:00:00").toLocaleDateString([], {month:"short",day:"numeric"});
const gameFor=(d,t)=>gamesOn(d).find(g=>g.away===t||g.home===t);
const weekDone=d=>{const gs=gamesOn(d);return gs.length>0&&gs.every(g=>g.status==="final")};
const resultOf=(d,t)=>{const g=gameFor(d,t);return g&&g.status==="final"&&g.winner?(g.winner===t?"w":"l"):"p"};

function puckRow(left,total){const r=el("div",{class:"pucks","aria-label":`${left} of ${total} lives left`});for(let i=0;i<total;i++)r.append(el("span",{class:"puck"+(i<left?"":" lost")}));return r}

/* ---------- Routing ---------- */
function parseRoute(){const p=location.hash.slice(1).split("/");if(p[0]==="pool"&&p[1])return{view:"pool",id:p[1],tab:["standings","commish"].includes(p[2])?p[2]:"saturday"};return{view:"home"}}

async function route(){
  if(!configured)return renderSetupNeeded();
  if(!S.session)return renderAuth();
  if(S.needsPassword)return renderSetPassword();
  const r=parseRoute();
  if(r.view==="pool"){
    if(S.loadedPool!==r.id){renderHeader(null);$("app").replaceChildren(el("p",{class:"meta",text:"Loading pool…"}));await loadPool(r.id)}
    if(!S.pool){location.hash="#home";return}
    renderPool(r.tab);
  }else{
    S.loadedPool=null;S.pool=null;
    renderHeader(null);
    await loadHome();renderHome();
  }
}
addEventListener("hashchange",route);

/* ---------- Header ---------- */
function renderHeader(tabs){
  const h=$("head");h.replaceChildren();
  const left=el("div",{});
  if(S.pool&&tabs)left.append(el("a",{class:"back",href:"#home",text:"‹ My pools"}));
  left.append(el("h1",{text:S.pool&&tabs?S.pool.name:"Survivor Pools"}));
  left.append(el("p",{class:"sub",text:S.pool&&tabs?`NHL Saturdays · ${S.pool.lives} ${S.pool.lives===1?"life":"lives"} · each team ${S.pool.max_picks_per_team===2?"twice":"once"}`:"NHL survivor pools for every Saturday"}));
  const row=el("div",{class:"hrow"},left);
  if(S.session){
    const meta=S.session.user.user_metadata||{};
    row.append(el("div",{class:"acct"},el("div",{text:meta.display_name||S.session.user.email}),
      el("button",{text:"Sign out",onclick:async()=>{await sb.auth.signOut();location.hash="#home"}})));
  }
  h.append(row);
  if(tabs){
    const nav=el("nav",{});
    for(const [key,label] of tabs)nav.append(el("a",{href:`#pool/${S.pool.id}/${key}`,text:label,"aria-current":parseRoute().tab===key?"page":null}));
    h.append(nav);
  }else h.append(el("div",{style:"height:4px"}));
}

/* ---------- Setup + auth ---------- */
function renderSetupNeeded(){
  renderHeader(null);
  $("app").replaceChildren(el("div",{class:"note warn"},el("strong",{text:"Almost there. "}),"Add your Supabase project URL and anon key at the top of index.html, then reload."));
}

function renderAuth(){
  renderHeader(null);
  const m=S.authMode;const app=$("app");app.replaceChildren();
  const p=el("div",{class:"panel"});
  const msg=S.authMsg?el("p",{class:S.authMsg.ok?"ok":"err",text:S.authMsg.text}):null;
  const name=el("input",{type:"text",autocomplete:"name",maxlength:"40"});
  const email=el("input",{type:"email",autocomplete:"email"});
  const pw=el("input",{type:"password",autocomplete:m==="signup"?"new-password":"current-password",minlength:"8"});
  const go=(mode)=>{S.authMode=mode;S.authMsg=null;renderAuth()};
  const btn=el("button",{class:"btn wide"});
  const busy=async fn=>{btn.disabled=true;try{await fn()}catch(e){S.authMsg={text:errText(e)};renderAuth()}btn.disabled=false};
  const redirect=location.origin+location.pathname;
  if(m==="signin"){
    p.append(el("h3",{text:"Sign in"}),msg,el("label",{class:"field"},el("span",{text:"Email"}),email),el("label",{class:"field"},el("span",{text:"Password"}),pw),btn);
    btn.textContent="Sign in";
    btn.onclick=()=>busy(async()=>{const{error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pw.value});if(error)throw error});
    p.append(el("div",{class:"links"},el("button",{text:"Create an account",onclick:()=>go("signup")}),el("button",{text:"Forgot password?",onclick:()=>go("forgot")})));
  }else if(m==="signup"){
    p.append(el("h3",{text:"Create an account"}),msg,el("label",{class:"field"},el("span",{text:"Your name"}),name),el("label",{class:"field"},el("span",{text:"Email"}),email),el("label",{class:"field"},el("span",{text:"Password (8+ characters)"}),pw),btn);
    btn.textContent="Create account";
    btn.onclick=()=>busy(async()=>{
      if(!name.value.trim())throw{message:"Enter your name."};
      if(pw.value.length<8)throw{message:"Use at least 8 characters for your password."};
      const{data,error}=await sb.auth.signUp({email:email.value.trim(),password:pw.value,options:{data:{display_name:name.value.trim()},emailRedirectTo:redirect}});
      if(error)throw error;
      if(!data.session){S.authMode="signin";S.authMsg={ok:true,text:"Check your email to confirm your account, then sign in."};renderAuth()}
    });
    p.append(el("div",{class:"links"},el("button",{text:"I already have an account",onclick:()=>go("signin")})));
  }else{
    p.append(el("h3",{text:"Reset your password"}),msg,el("label",{class:"field"},el("span",{text:"Email"}),email),btn);
    btn.textContent="Send reset link";
    btn.onclick=()=>busy(async()=>{const{error}=await sb.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:redirect});if(error)throw error;S.authMsg={ok:true,text:"If that email has an account, a reset link is on its way."};renderAuth()});
    p.append(el("div",{class:"links"},el("button",{text:"Back to sign in",onclick:()=>go("signin")})));
  }
  app.append(p);
}

function renderSetPassword(){
  renderHeader(null);
  const invited=AUTH_TYPE==="invite";
  const meta=S.session.user.user_metadata||{};
  const name=el("input",{type:"text",maxlength:"40",value:meta.display_name||""});
  const pw=el("input",{type:"password",autocomplete:"new-password",minlength:"8"});
  const btn=el("button",{class:"btn wide",text:"Save password"});
  const msg=el("p",{class:"err",hidden:true});
  btn.onclick=async()=>{
    msg.hidden=true;
    if(invited&&!name.value.trim()){msg.textContent="Enter your name.";msg.hidden=false;return}
    if(pw.value.length<8){msg.textContent="Use at least 8 characters for your password.";msg.hidden=false;return}
    btn.disabled=true;
    const data=invited?{display_name:name.value.trim()}:undefined;
    const{error}=await sb.auth.updateUser({password:pw.value,data});
    if(error){msg.textContent=errText(error);msg.hidden=false;btn.disabled=false;return}
    if(invited)await sb.from("profiles").update({display_name:name.value.trim()}).eq("id",uid());
    S.needsPassword=false;toast("Password saved");location.hash="#home";route();
  };
  $("app").replaceChildren(el("div",{class:"panel"},
    el("h3",{text:invited?"Welcome! Set up your account":"Choose a new password"}),
    invited?el("p",{class:"meta",style:"margin:0 0 14px",text:`Signed in as ${S.session.user.email}. Pick a password so you can sign in next time.`}):null,
    msg,
    invited?el("label",{class:"field"},el("span",{text:"Your name"}),name):null,
    el("label",{class:"field"},el("span",{text:"Password (8+ characters)"}),pw),btn));
}

/* ---------- Home ---------- */
async function loadHome(){
  const [inv,pools]=await Promise.all([sb.rpc("my_invites"),sb.from("pools").select("id,name,commissioner_id,lives,max_picks_per_team").order("created_at")]);
  S.invites=inv.data||[];S.pools=pools.data||[];
}

function renderHome(){
  const app=$("app");app.replaceChildren();
  for(const i of S.invites){
    const accept=el("button",{class:"btn",text:"Join"});
    const decline=el("button",{class:"sm",text:"Decline"});
    accept.onclick=async()=>{accept.disabled=true;const{data,error}=await sb.rpc("accept_invite",{p_invite:i.id});if(error){toast(errText(error));accept.disabled=false;return}toast(`You joined ${i.pool_name}`);location.hash=`#pool/${data}/saturday`};
    decline.onclick=async()=>{await sb.from("invites").delete().eq("id",i.id);await loadHome();renderHome()};
    app.append(el("div",{class:"panel"},el("h3",{text:i.pool_name}),
      el("p",{class:"meta",style:"margin:0 0 12px",text:`${i.invited_by_name||"The commissioner"} invited you to join this pool.`}),
      el("div",{class:"acts"},accept,decline)));
  }
  app.append(el("h2",{style:"margin:4px 0 12px;font-size:1.6rem",text:"Your pools"}));
  if(!S.pools.length)app.append(el("div",{class:"note",text:"You’re not in any pools yet. Create one below, or ask a commissioner to invite your email."}));
  for(const p of S.pools){
    app.append(el("a",{class:"poolcard",href:`#pool/${p.id}/saturday`},
      el("div",{},el("strong",{text:p.name}),el("small",{text:`${p.lives} ${p.lives===1?"life":"lives"} · each team ${p.max_picks_per_team===2?"twice":"once"}`})),
      p.commissioner_id===uid()?el("span",{class:"badge",text:"Commissioner"}):null));
  }
  const name=el("input",{type:"text",placeholder:"Pool name",maxlength:"60","aria-label":"Pool name"});
  const btn=el("button",{class:"btn",text:"Create pool"});
  btn.onclick=async()=>{const n=name.value.trim();if(!n)return name.focus();btn.disabled=true;
    const{data,error}=await sb.rpc("create_pool",{p_name:n});
    if(error){toast(errText(error));btn.disabled=false;return}
    toast("Pool created. Invite your players next.");location.hash=`#pool/${data}/commish`};
  app.append(el("div",{class:"panel",style:"margin-top:18px"},el("h3",{text:"Start a new pool"}),
    el("p",{class:"meta",style:"margin:0 0 12px",text:"You’ll be the commissioner. You can change the rules and invite people by email."}),
    el("div",{class:"row"},name,btn)));
}

/* ---------- Pool data ---------- */
async function loadPool(id,quiet){
  const{data:pool,error}=await sb.from("pools").select("*").eq("id",id).maybeSingle();
  if(error||!pool){S.pool=null;S.loadedPool=null;if(!quiet)toast("You don’t have access to that pool.");return}
  const isC=pool.commissioner_id===uid();
  const [games,mine,st,all,pend]=await Promise.all([
    sb.from("games").select("*").gte("game_date",pool.start_date).order("game_date").order("start_time"),
    sb.from("picks").select("game_date,team,game_id").eq("pool_id",id).eq("user_id",uid()),
    sb.rpc("pool_standings",{p:id}),
    sb.rpc("pool_picks",{p:id}),
    isC?sb.from("invites").select("id,email,created_at").eq("pool_id",id).is("accepted_at",null).order("created_at"):Promise.resolve({data:[]})
  ]);
  const sameWeek=S.loadedPool===id;
  S.pool=pool;S.games=games.data||[];S.myPicks=mine.data||[];S.standings=st.data||[];S.allPicks=all.data||[];S.pending=pend.data||[];
  const weeks=weekList();
  if(!sameWeek||S.weekIdx<0||S.weekIdx>=weeks.length){const i=weeks.findIndex(d=>!weekDone(d));S.weekIdx=i===-1?weeks.length-1:i}
  S.loadedPool=id;
}
const weekList=()=>[...new Set(S.games.map(g=>g.game_date))].sort();
const isCommish=()=>S.pool&&S.pool.commissioner_id===uid();
async function refresh(){if(S.pool){await loadPool(S.pool.id,true);if(S.pool)renderPool(parseRoute().tab)}}

/* ---------- Pool views ---------- */
function renderPool(tab){
  const tabs=[["saturday","This Saturday"],["standings","Standings"]];
  if(isCommish())tabs.push(["commish","Commissioner"]);
  if(tab==="commish"&&!isCommish())tab="saturday";
  renderHeader(tabs);
  const app=$("app");app.replaceChildren();
  if(tab==="standings")renderStandings(app);
  else if(tab==="commish")renderCommish(app);
  else renderSaturday(app);
}

function renderSaturday(v){
  const me=S.standings.find(r=>r.user_id===uid());
  const limit=S.pool.max_picks_per_team;
  const counts={};for(const p of S.myPicks)counts[p.team]=(counts[p.team]||0)+1;
  if(me){
    v.append(el("div",{class:"me"},
      el("div",{},el("div",{class:"who",text:me.display_name||"You"}),
        el("div",{class:"used",text:me.lives_left<=0?"Eliminated":`${Object.keys(counts).length} team${Object.keys(counts).length===1?"":"s"} used · ${me.wins} win${me.wins===1?"":"s"}`})),
      puckRow(me.lives_left,S.pool.lives)));
  }
  const weeks=weekList();
  if(!weeks.length){
    v.append(el("div",{class:"note"},el("strong",{text:"No Saturday games yet. "}),"Games load automatically once the NHL schedule syncs. Odds appear a few days before puck drop."));
    renderMyPicks(v,counts,limit);return;
  }
  const d=weeks[S.weekIdx];
  const prev=el("button",{"aria-label":"Previous Saturday",text:"‹",onclick:()=>{S.weekIdx--;renderPool("saturday")}});prev.disabled=S.weekIdx<=0;
  const next=el("button",{"aria-label":"Next Saturday",text:"›",onclick:()=>{S.weekIdx++;renderPool("saturday")}});next.disabled=S.weekIdx>=weeks.length-1;
  v.append(el("div",{class:"weekbar"},prev,el("h2",{text:fmtDate(d)}),next));
  const gs=gamesOn(d);
  const oddsAt=gs.map(g=>g.odds_updated_at).filter(Boolean).sort().pop();
  v.append(el("p",{class:"meta",text:(oddsAt?`Odds updated ${new Date(oddsAt).toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"})}. `:"")+(S.pool.lock_mode==="first"?"All picks lock at the first puck drop.":"Picks lock when your game starts.")}));

  const myPickRow=S.myPicks.find(p=>p.game_date===d);
  const myPick=myPickRow&&myPickRow.team;
  const myGame=myPick&&gameFor(d,myPick);
  const pickLocked=myGame&&locked(d,myGame);
  const alive=me&&me.lives_left>0;

  for(const g of gs){
    const card=el("div",{class:"game"});
    const right=g.status==="final"?el("span",{class:"score",text:`Final ${g.away_score}–${g.home_score}`}):g.status==="live"?el("span",{class:"score",text:`Live ${g.away_score??0}–${g.home_score??0}`}):el("span",{text:fmtTime(g.start_time)});
    card.append(el("div",{class:"top"},el("span",{text:"Away @ Home"}),right));
    const sides=el("div",{class:"sides"});
    for(const [team,pct,cls] of [[g.away,g.away_pct,"away"],[g.home,g.home_pct,"home"]]){
      const isPick=myPick===team;
      const used=(counts[team]||0)-(isPick?1:0);
      const maxed=used>=limit;
      const res=isPick&&g.status==="final"&&g.winner?(g.winner===team?" won":" lost"):"";
      let tag=null;
      if(isPick)tag=res===" won"?"Your pick · won":res===" lost"?"Your pick · lost":"Your pick";
      else if(maxed)tag=limit===2?"Used twice":"Used";
      else if(used>0)tag="Used once · 1 left";
      const canTap=alive&&!locked(d,g)&&!pickLocked&&(isPick||!maxed);
      const b=el("button",{class:`side ${cls}${isPick?" picked":""}${maxed&&!isPick?" used":""}${res}`,"aria-pressed":isPick?"true":"false",
        "aria-label":`${teamName(team)}${pct!=null?`, ${pct}% to win`:""}${isPick?", your pick":""}${maxed&&!isPick?", already used":""}`},
        el("span",{class:"abbr",text:team}),el("span",{class:"name",text:teamName(team)}),
        el("span",{class:"pct",text:pct!=null?`${Math.round(pct)}%`:"Odds soon"}),
        tag?el("div",{},el("span",{class:"tag",text:tag})):null);
      b.disabled=!canTap;
      if(canTap)b.onclick=async()=>{
        b.disabled=true;
        const{error}=await sb.rpc("make_pick",{p:S.pool.id,g_date:d,p_team:isPick?null:team});
        if(error){toast(errText(error));b.disabled=false;return}
        toast(isPick?"Pick cleared":`Picked ${teamName(team)}`);refresh();
      };
      sides.append(b);
    }
    card.append(sides);
    if(g.away_pct!=null&&g.home_pct!=null){
      const t=(+g.away_pct)+(+g.home_pct)||100;
      card.append(el("div",{class:"bar","aria-hidden":"true"},
        el("span",{style:`width:${g.away_pct/t*100}%;background:${teamColor(g.away)}`}),
        el("span",{style:`width:${g.home_pct/t*100}%;background:${teamColor(g.home)}`})));
    }
    v.append(card);
  }
  renderMyPicks(v,counts,limit);
}

function renderMyPicks(v,counts,limit){
  if(!S.myPicks.length)return;
  const list=el("div",{class:"panel",style:"margin-top:22px"},el("h3",{text:"Your picks"}));
  for(const p of [...S.myPicks].sort((a,b)=>b.game_date.localeCompare(a.game_date))){
    const r=resultOf(p.game_date,p.team);
    list.append(el("div",{class:"prow"},el("div",{class:"top"},
      el("div",{},el("strong",{text:teamName(p.team)}),el("div",{class:"detail",style:"margin:0",text:fmtDate(p.game_date)})),
      el("span",{class:"hist"},el("span",{class:r==="p"?"":r,text:r==="w"?"Won":r==="l"?"Lost · strike":"Saved"})))));
  }
  const maxed=Object.entries(counts).filter(([,c])=>c>=limit).map(([t])=>t);
  if(maxed.length)list.append(el("p",{class:"meta",style:"margin:10px 0 0",text:`Can’t pick again: ${maxed.join(", ")}`}));
  v.append(list);
}

function renderStandings(v){
  const rows=[...S.standings].sort((a,b)=>b.lives_left-a.lives_left||b.wins-a.wins||(a.display_name||"").localeCompare(b.display_name||""));
  const alive=rows.filter(r=>r.lives_left>0).length;
  v.append(el("p",{class:"meta",style:"margin:0 0 12px",text:`${alive} of ${rows.length} still alive`}));
  const tb=el("tbody");
  for(const r of rows){
    const hist=el("div",{class:"hist"});
    for(const p of S.allPicks.filter(x=>x.user_id===r.user_id).sort((a,b)=>a.game_date.localeCompare(b.game_date))){
      if(p.hidden){hist.append(el("span",{title:fmtDate(p.game_date),text:"🔒"}));continue}
      const res=resultOf(p.game_date,p.team);
      hist.append(el("span",{class:res==="p"?"":res,title:fmtDate(p.game_date),text:p.team}));
    }
    tb.append(el("tr",{class:r.lives_left<=0?"out":""},
      el("td",{},el("div",{style:"font-weight:600",text:(r.display_name||"Player")+(r.user_id===uid()?" (you)":"")+(r.is_commissioner?" · commissioner":"")}),
        el("div",{class:"meta",style:"margin:0",text:`${r.wins}–${r.losses}${r.missed?` · ${r.missed} missed`:""}`}),hist),
      el("td",{},puckRow(r.lives_left,S.pool.lives))));
  }
  v.append(el("div",{class:"tablewrap"},el("table",{},el("thead",{},el("tr",{},el("th",{text:"Player · picks"}),el("th",{text:"Lives"}))),tb)));
  if(S.pool.reveal_picks!=="always")v.append(el("p",{class:"meta",style:"margin-top:10px",text:"Other players’ picks show as 🔒 until they lock."}));
  if(!isCommish()){
    const leave=el("button",{class:"sm danger",text:"Leave this pool"});
    leave.onclick=async()=>{if(leave.dataset.armed!=="1"){leave.dataset.armed="1";leave.textContent="Tap again to leave";return}
      const{error}=await sb.from("pool_members").delete().eq("pool_id",S.pool.id).eq("user_id",uid());
      if(error)return toast(errText(error));toast("You left the pool");location.hash="#home"};
    v.append(el("div",{style:"margin-top:22px"},leave));
  }
}

function renderCommish(v){
  const po=S.pool;
  const opt=(pairs,cur)=>pairs.map(([val,label])=>el("option",{value:val,selected:String(val)===String(cur),text:label}));
  const name=el("input",{type:"text",value:po.name,maxlength:"60"});
  const lives=el("select",{},...opt([1,2,3,4,5].map(n=>[n,`${n} ${n===1?"life":"lives"}`]),po.lives));
  const reuse=el("select",{},...opt([[1,"Once per season"],[2,"Twice per season"]],po.max_picks_per_team));
  const lock=el("select",{},...opt([["game","When each player’s picked game starts"],["first","At the first puck drop of the day"]],po.lock_mode));
  const reveal=el("select",{},...opt([["start","After they lock"],["always","Right away"]],po.reveal_picks));
  const missed=el("input",{type:"checkbox",checked:po.missed_pick_strike});
  const save=el("button",{class:"btn",text:"Save settings"});
  save.onclick=async()=>{save.disabled=true;
    const{error}=await sb.from("pools").update({name:name.value.trim()||po.name,lives:+lives.value,max_picks_per_team:+reuse.value,lock_mode:lock.value,reveal_picks:reveal.value,missed_pick_strike:missed.checked}).eq("id",po.id);
    save.disabled=false;if(error)return toast(errText(error));toast("Settings saved");refresh()};
  v.append(el("div",{class:"panel"},el("h3",{text:"Pool settings"}),
    el("label",{class:"field"},el("span",{text:"Pool name"}),name),
    el("label",{class:"field"},el("span",{text:"Lives per player"}),lives),
    el("label",{class:"field"},el("span",{text:"Each team can be picked"}),reuse),
    el("label",{class:"field"},el("span",{text:"Picks lock"}),lock),
    el("label",{class:"field"},el("span",{text:"Show other players’ picks"}),reveal),
    el("label",{class:"check"},missed,"A missed Saturday costs a life"),save));

  // Invites
  const email=el("input",{type:"email",placeholder:"friend@example.com","aria-label":"Email to invite"});
  const send=el("button",{class:"btn",text:"Send invite"});
  send.onclick=async()=>{const e=email.value.trim();if(!e)return email.focus();send.disabled=true;
    const{data,error}=await sb.functions.invoke("send-invite",{body:{pool_id:po.id,email:e}});
    send.disabled=false;
    let msg=error?errText(error):data&&data.error;
    if(error&&error.context&&error.context.json){try{msg=(await error.context.json()).error||msg}catch{}}
    if(msg)return toast(msg);
    toast(data.status==="existing_user"?`Invite sent. ${e} already has an account and will see it when they sign in.`:`Invite emailed to ${e}`);
    email.value="";refresh()};
  const inv=el("div",{class:"panel"},el("h3",{text:"Invite players"}),
    el("p",{class:"meta",style:"margin:0 0 12px",text:"They’ll get an email with a link to join and set a password."}),
    el("div",{class:"row"},email,send));
  if(S.pending.length){
    inv.append(el("p",{style:"font-weight:600;margin:16px 0 6px",text:"Waiting to join"}));
    for(const p of S.pending){
      inv.append(el("div",{class:"prow"},el("div",{class:"top"},
        el("div",{},el("div",{text:p.email}),el("div",{class:"detail",style:"margin:0",text:`Invited ${shortDate(p.created_at.slice(0,10))}`})),
        el("button",{class:"sm danger",text:"Cancel",onclick:async()=>{await sb.from("invites").delete().eq("id",p.id);toast("Invite cancelled");refresh()}}))));
    }
  }
  v.append(inv);

  // Players + strikes
  const pl=el("div",{class:"panel"},el("h3",{text:"Players and strikes"}));
  for(const r of [...S.standings].sort((a,b)=>(a.display_name||"").localeCompare(b.display_name||""))){
    const adjust=async delta=>{const{error}=await sb.rpc("adjust_strike",{p:po.id,u:r.user_id,delta});if(error)return toast(errText(error));toast(delta>0?"Strike added":"Strike given back");refresh()};
    const add=el("button",{class:"sm",text:"Add strike",onclick:()=>adjust(1)});
    const back=el("button",{class:"sm",text:"Give strike back",onclick:()=>adjust(-1)});
    back.disabled=r.losses+r.missed+r.adjust<=0;
    const acts=el("div",{class:"acts"},add,back);
    if(r.user_id!==uid()){
      const rm=el("button",{class:"sm danger",text:"Remove player"});
      rm.onclick=async()=>{if(rm.dataset.armed!=="1"){rm.dataset.armed="1";rm.textContent="Tap again to remove";return}
        const{error}=await sb.rpc("remove_member",{p:po.id,u:r.user_id});if(error)return toast(errText(error));toast("Player removed");refresh()};
      acts.append(rm);
    }
    const parts=[`${r.losses} from losses`];if(r.missed)parts.push(`${r.missed} missed`);if(r.adjust)parts.push(`${r.adjust>0?"+":""}${r.adjust} by you`);
    pl.append(el("div",{class:"prow"},
      el("div",{class:"top"},el("strong",{text:(r.display_name||"Player")+(r.user_id===uid()?" (you)":"")}),puckRow(r.lives_left,po.lives)),
      el("div",{class:"detail",text:`${r.strikes} strike${r.strikes===1?"":"s"}: ${parts.join(", ")} · ${r.lives_left<=0?"eliminated":`${r.lives_left} left`}`}),acts));
  }
  v.append(pl);

  // Games + danger zone
  const sync=el("button",{class:"sm",text:"Refresh games and odds"});
  sync.onclick=async()=>{sync.disabled=true;const{data,error}=await sb.functions.invoke("sync-games",{body:{}});sync.disabled=false;
    if(error||!data||!data.ok)return toast("Couldn’t refresh games right now.");toast("Games refreshed");refresh()};
  const del=el("button",{class:"sm danger",text:"Delete this pool"});
  del.onclick=async()=>{if(del.dataset.armed!=="1"){del.dataset.armed="1";del.textContent="Tap again to delete for everyone";return}
    const{error}=await sb.from("pools").delete().eq("id",po.id);if(error)return toast(errText(error));toast("Pool deleted");location.hash="#home"};
  v.append(el("div",{class:"panel"},el("h3",{text:"Games"}),
    el("p",{class:"meta",style:"margin:0 0 12px",text:"Games, scores and odds update on their own every 20 minutes. Refresh if you need them sooner."}),
    el("div",{class:"acts"},sync,del)));
}

/* ---------- Start ---------- */
(async()=>{
  if(!configured)return route();
  sb.auth.onAuthStateChange((event,session)=>{
    const was=S.session&&S.session.user.id;S.session=session;
    if(event==="PASSWORD_RECOVERY")S.needsPassword=true;
    if(event==="SIGNED_OUT"){S.pool=null;S.loadedPool=null}
    if((session&&session.user.id)!==was)setTimeout(route,0);
  });
  const{data}=await sb.auth.getSession();S.session=data.session;
  if(/access_token|error_description/.test(location.hash)){
    const err=new URLSearchParams(location.hash.slice(1)).get("error_description");
    history.replaceState(null,"",location.pathname+location.search+"#home");
    if(err)S.authMsg={text:err.replace(/\+/g," ")};
  }
  route();
  setInterval(()=>{const r=parseRoute();if(document.visibilityState==="visible"&&S.session&&r.view==="pool"&&r.tab!=="commish")refresh()},60000);
})();
</script>
